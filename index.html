<!--
  CLUB SOLIDARIO RIVERA · HERRAMIENTA DE GESTIÓN DE EVENTOS (DEMO)
  Desarrollado por WYDAN Solutions — herramientas web 100% a medida.
  Un solo archivo: se abre con doble clic. Estructura del código:
    1) Configuración, textos, logos e íconos     2) Utilidades (formatos UY, fechas)
    3) CAPA DE DATOS (Store) ← acá se enchufa la nube (Firebase)
    4) Datos de ejemplo   5) Lógica del club (cálculos)   6) Núcleo de interfaz
    7) Panel, Eventos, Tareas, Socios, Colaboradores   8) Ficha del evento
    9) Cenas   10) Rifas   11) Remates   12) Finanzas y Reportes   13) Configuración
    14) Documentos (impresión, PDF y Excel)   15) Arranque
-->
<style>
/* =====================================================================
   ESTILOS — Club Solidario Rivera · Gestión de eventos
   Paleta del club + estados. Mobile-first.
   ===================================================================== */
:root{
  --azul:#17458F; --azul-900:#0E2D63; --azul-700:#1B4FA3; --azul-50:#EAF0FA;
  --oro:#F7A81B; --oro-700:#C98507; --oro-50:#FEF4E0;
  --azure:#0067C8; --azure-50:#E5F0FB;
  --bg:#F4F6F9; --card:#FFFFFF; --borde:#DDE3EC; --borde-2:#E9EDF3;
  --texto:#1F2A44; --muted:#5E6A84; --muted-2:#8C96AB;
  --ok:#2E9E6A; --ok-50:#E6F5EE; --warn:#E0A100; --warn-50:#FDF5DD; --bad:#D64545; --bad-50:#FBE9E9;
  --cena:#D41367; --cena-50:#FCE8F1; --rifa:#FF7600; --rifa-50:#FFF0E3; --remate:#901F93; --remate-50:#F5E7F5;
  --r:12px; --r-sm:8px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(23,40,80,.06),0 1px 3px rgba(23,40,80,.06);
  --sh-2:0 4px 14px rgba(23,40,80,.08),0 1px 3px rgba(23,40,80,.06);
  --sh-3:0 18px 50px rgba(14,45,99,.22);
  --font:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --side:252px; --top:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;color:var(--texto);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azure);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;line-height:1.25}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:#A87800}
.strong{font-weight:700}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid rgba(0,103,200,.45);outline-offset:2px;border-radius:6px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.i.sm{width:16px;height:16px} svg.i.lg{width:26px;height:26px}

/* ---------- Pantalla de bloqueo ---------- */
#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 700px at 80% -10%,#2357AE 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#0B2557 0%,transparent 55%),var(--azul);overflow:hidden;transition:opacity .6s ease,visibility .6s}
#lock.out{opacity:0;visibility:hidden}
#lock .rueda-fondo{position:absolute;width:min(110vmax,1300px);right:-28vmax;top:50%;margin-top:calc(min(110vmax,1300px) / -2);opacity:.07;animation:girar 160s linear infinite;pointer-events:none}
#lock .rueda-fondo svg{width:100%;height:auto;display:block}
@keyframes girar{to{transform:rotate(360deg)}}
.lock-card{position:relative;width:100%;max-width:420px;padding:34px 30px 26px;border-radius:22px;background:rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.22);box-shadow:0 30px 80px rgba(0,0,0,.35);color:#fff}
.lock-card .logo-club{background:#fff;border-radius:14px;padding:16px 18px 12px;display:flex;justify-content:center;margin-bottom:22px}
.lock-card .logo-club svg{height:76px;width:auto}
.lock-card h1{font-family:var(--serif);font-weight:400;font-size:27px;margin-bottom:4px}
.lock-card p.sub{margin:0 0 20px;color:rgba(255,255,255,.78);font-size:14px}
.lock-users{display:grid;gap:8px;margin-bottom:16px}
.lock-user{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);cursor:pointer;text-align:left;color:#fff;transition:.2s}
.lock-user:hover{background:rgba(255,255,255,.12)}
.lock-user.sel{border-color:var(--oro);background:rgba(247,168,27,.16)}
.lock-user .av{width:38px;height:38px;border-radius:50%;background:var(--oro);color:var(--azul-900);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.lock-user b{display:block;font-size:15px} .lock-user span{font-size:12.5px;color:rgba(255,255,255,.75)}
.lock-pass{display:flex;gap:8px}
.lock-pass input{flex:1;min-width:0;height:50px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.95);color:var(--texto);padding:0 16px;font-size:18px;letter-spacing:.25em}
.lock-pass input::placeholder{letter-spacing:normal;font-size:15px;color:#8a93a8}
.lock-pass button{height:50px;padding:0 22px;border:0;border-radius:12px;background:var(--oro);color:var(--azul-900);font-weight:700;font-size:16px;cursor:pointer}
.lock-err{min-height:20px;margin-top:8px;font-size:13px;color:#FFD9D9}
.lock-hint{margin-top:2px;font-size:12px;color:rgba(255,255,255,.6)}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.wydan{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.04em;opacity:.75}
.wydan img{height:36px;width:auto;display:inline-block;vertical-align:middle}
.side .foot .wydan{opacity:1;color:var(--muted)}
.app-foot .wydan img{height:28px}
/* Presentación de WYDAN en el ingreso (acompaña, sin competir con la marca el club) */
#lock{overflow-y:auto;overflow-x:hidden}
#lock .rueda-fondo{position:fixed}
.lock-wrap{position:relative;margin:auto;display:grid;grid-template-columns:minmax(0,440px) 420px;gap:56px;align-items:center;width:100%;max-width:960px}
.wydan-pres{color:#fff;animation:fadein .8s ease .15s both}
.wp-marca{display:inline-flex;flex-direction:column;align-items:flex-start;gap:8px}
.wp-logo{display:inline-flex;background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.wp-logo img{height:56px;width:auto;display:block}
.wp-marca small{display:block;font-size:12px;color:rgba(255,255,255,.8)}
.wydan-pres h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.2;margin:22px 0 12px}
.wp-intro{margin:0 0 22px;font-size:15px;line-height:1.6;color:rgba(255,255,255,.82)}
.wp-puntos{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:14px}
.wp-puntos li{display:flex;gap:12px;align-items:flex-start}
.wp-ic{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.wp-puntos b{display:block;font-size:15px;color:#fff}
.wp-puntos li>span:last-child{font-size:13.5px;color:rgba(255,255,255,.75);line-height:1.45}
.wp-probar>span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;margin-bottom:8px;font-weight:700}
.wp-probar div{display:flex;flex-wrap:wrap;gap:6px}
.wp-probar i{font-style:normal;font-size:12.5px;padding:4px 11px;border-radius:14px;border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.92)}
.wp-contacto{margin-top:20px;font-size:13px;display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.85)}
.wp-contacto a{color:#fff;text-decoration:underline;text-underline-offset:3px}
@media (max-width:960px){
  .lock-wrap{grid-template-columns:minmax(0,1fr);max-width:440px;gap:30px;padding:8px 0 24px}
  .lock-card{order:-1}
  .wydan-pres{padding:0 6px}
  .wydan-pres h2{font-size:25px;margin-top:18px}
}

/* ---------- Estructura de la app ---------- */
#app{display:none;min-height:100vh}
#app.on{display:block;animation:fadein .5s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:#fff;border-right:1px solid var(--borde);display:flex;flex-direction:column;z-index:30}
.side .brand{height:84px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--borde-2)}
.side .brand svg{height:46px;width:auto}
.side nav{flex:1;overflow:auto;padding:14px 12px}
.nav-a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--texto);font-weight:600;font-size:14.5px;margin-bottom:2px;cursor:pointer;border:0;background:none;width:100%;text-align:left;text-decoration:none!important}
.nav-a:hover{background:var(--bg)}
.nav-a.on{background:var(--azul-50);color:var(--azul)}
.nav-a.on svg{color:var(--azul)}
.nav-a svg{color:var(--muted)}
.nav-a .badge{margin-left:auto}
.side .foot{padding:14px 18px;border-top:1px solid var(--borde-2);color:var(--muted)}
.main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:var(--top);background:rgba(244,246,249,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--borde);display:flex;align-items:center;gap:12px;padding:0 24px}
.top .mob-logo{display:none}
.search{position:relative;flex:1;max-width:520px}
.search input{width:100%;height:42px;border-radius:21px;border:1px solid var(--borde);background:#fff;padding:0 16px 0 42px;font-size:14.5px}
.search>svg{position:absolute;left:14px;top:11px;color:var(--muted-2)}
.search-res{position:absolute;top:48px;left:0;right:0;background:#fff;border:1px solid var(--borde);border-radius:14px;box-shadow:var(--sh-3);max-height:70vh;overflow:auto;padding:6px;z-index:40}
.search-res h6{margin:8px 10px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2)}
.search-res button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer}
.search-res button:hover,.search-res button.f{background:var(--bg)}
.search-res small{color:var(--muted);display:block;font-size:12.5px}
.top .sp{flex:1}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:24px;background:#fff;border:1px solid var(--borde)}
.user-chip .av{width:34px;height:34px}
.user-chip b{font-size:13.5px;display:block;line-height:1.2} .user-chip span{font-size:11.5px;color:var(--muted)}
.content{padding:24px;max-width:1400px;width:100%;margin:0 auto;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-family:var(--serif);font-weight:400;font-size:30px;color:var(--azul)}
.page-head p{margin:4px 0 0;color:var(--muted)}
.page-head .acts{display:flex;gap:8px;flex-wrap:wrap}
.app-foot{padding:16px 24px 24px;text-align:center;color:var(--muted-2)}
.bnav{display:none}

/* ---------- Componentes ---------- */
.card{background:var(--card);border:1px solid var(--borde);border-radius:var(--r);box-shadow:var(--sh-1)}
.card.pad{padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--borde-2)}
.card-h h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-h .link{font-size:13.5px;font-weight:600}
.card-b{padding:16px 20px}
.card.clic{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.card.clic:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:#cbd5e4}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.span2{grid-column:span 2}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.mt{margin-top:16px} .mt-s{margin-top:8px} .mt-l{margin-top:24px} .mb{margin-bottom:16px}

.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lbl{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:700;color:var(--azul);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:600}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi.ok .val{color:var(--ok)} .kpi.bad .val{color:var(--bad)} .kpi.warn .val{color:#A87800}
.kpi .ico{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--azul-50);color:var(--azul)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--borde);background:#fff;color:var(--texto);font-weight:600;font-size:14.5px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;text-decoration:none!important}
.btn:hover{background:#F7F9FC;border-color:#C9D2E0}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--oro);border-color:var(--oro);color:var(--azul-900)}
.btn-p:hover{background:#F9B43A;border-color:#F9B43A}
.btn-b{background:var(--azul);border-color:var(--azul);color:#fff}
.btn-b:hover{background:var(--azul-700);border-color:var(--azul-700)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff} .btn-ok:hover{background:#278a5c}
.btn-bad{background:#fff;border-color:#efc4c4;color:var(--bad)} .btn-bad:hover{background:var(--bad-50)}
.btn-wa{background:#25D366;border-color:#25D366;color:#073b1d} .btn-wa:hover{background:#3ddc78}
.btn-g{background:transparent;border-color:transparent;color:var(--azure)} .btn-g:hover{background:var(--azure-50);border-color:transparent}
.btn-sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn-xs{height:28px;padding:0 9px;font-size:12.5px;border-radius:7px;gap:5px}
.btn-lg{height:52px;padding:0 24px;font-size:16px;border-radius:12px}
.btn-ico{width:36px;padding:0}
.btn-sm.btn-ico{width:34px} .btn-xs.btn-ico{width:28px}

.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12.5px;font-weight:600;background:#EEF1F6;color:#46526B;white-space:nowrap}
.chip::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.chip.nodot::before{display:none}
.chip.ok{background:var(--ok-50);color:#1F7A50} .chip.warn{background:var(--warn-50);color:#8E6600} .chip.bad{background:var(--bad-50);color:#B33232}
.chip.blue{background:var(--azul-50);color:var(--azul)} .chip.azure{background:var(--azure-50);color:var(--azure)} .chip.gold{background:var(--oro-50);color:#9A6500}
.chip.gray{background:#EEF1F6;color:#5E6A84} .chip.violet{background:var(--remate-50);color:var(--remate)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--bad);color:#fff;font-size:12px;font-weight:700}
.badge.gold{background:var(--oro);color:var(--azul-900)} .badge.blue{background:var(--azul)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.sem{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
.sem.ok{background:var(--ok)} .sem.warn{background:var(--warn)} .sem.bad{background:var(--bad)} .sem.done{background:#B8C2D3}
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;letter-spacing:.02em}
.av.sm{width:28px;height:28px;font-size:11px}

.prog{height:8px;border-radius:5px;background:#E7EBF2;overflow:hidden;position:relative}
.prog>i{display:block;height:100%;border-radius:5px;background:var(--azul);transition:width .6s ease}
.prog.gold>i{background:var(--oro)} .prog.ok>i{background:var(--ok)} .prog.bad>i{background:var(--bad)} .prog.warn>i{background:var(--warn)}
.prog.lg{height:12px;border-radius:7px}
.prog-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px;gap:8px}
.prog-l b{color:var(--texto)}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--borde);margin-bottom:20px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;padding:11px 14px;border:0;background:none;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--texto)}
.tab.on{color:var(--azul);border-bottom-color:var(--oro)}
.seg{display:inline-flex;background:#E9EDF3;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--azul);box-shadow:var(--sh-1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--borde);background:#fff;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.fchip .n{font-weight:700;opacity:.8}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.inp,.sel{height:42px;border-radius:10px;border:1px solid var(--borde);background:#fff;padding:0 12px;font-size:14.5px;min-width:0}
.inp:focus,.sel:focus,textarea:focus{border-color:var(--azure);outline:0;box-shadow:0 0 0 3px rgba(0,103,200,.15)}
.inp-s{position:relative;flex:1;min-width:200px;max-width:380px}
.inp-s input{width:100%;padding-left:38px}
.inp-s svg{position:absolute;left:12px;top:11px;color:var(--muted-2)}

/* Tablas */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.t th{position:sticky;top:0;background:#F7F9FC;color:var(--azul);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--borde);white-space:nowrap}
.t td{padding:11px 12px;border-bottom:1px solid var(--borde-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:#FAFBFD}
.t tr.clic{cursor:pointer}
.t tfoot td{font-weight:700;background:#F7F9FC;border-top:1px solid var(--borde)}
.t .num{text-align:right}
.t th.num{text-align:right}
.t td.act{text-align:right;white-space:nowrap}
.t .sub{color:var(--muted);font-size:12.5px}
.t tr.grp td{background:#F3F6FB;font-weight:700;color:var(--azul)}

.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty svg{width:42px;height:42px;color:#C1C9D8;margin-bottom:6px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:14px}
.alert.bad{background:var(--bad-50);color:#8E2626} .alert.warn{background:var(--warn-50);color:#6E5000} .alert.info{background:var(--azure-50);color:#0A4C8C} .alert.ok{background:var(--ok-50);color:#1B6544}
.alert svg{flex:none;margin-top:1px}

/* Listas tipo item */
.li{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--borde-2)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t1{font-weight:600}
.li .t2{font-size:13px;color:var(--muted)}
.li.clic{cursor:pointer} .li.clic:hover{background:#FAFBFD}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Eventos: categorías */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:22px}
.cat{position:relative;padding:20px;border-radius:var(--r-lg);border:2px solid var(--borde);background:#fff;cursor:pointer;text-align:left;transition:.2s;overflow:hidden}
.cat:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}
.cat .cat-ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:12px}
.cat h3{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--azul)}
.cat p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.cat .cnt{position:absolute;top:18px;right:18px;font-size:13px;font-weight:700;color:var(--muted)}
.cat.on{border-color:currentColor}
.cat::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:currentColor;opacity:0;transition:.2s}
.cat.on::after{opacity:1}
.c-cena{color:var(--cena)} .c-rifa{color:var(--rifa)} .c-remate{color:var(--remate)}
.bg-cena{background:var(--cena-50);color:var(--cena)} .bg-rifa{background:var(--rifa-50);color:var(--rifa)} .bg-remate{background:var(--remate-50);color:var(--remate)}
.ev-card{padding:0;overflow:hidden;display:flex;flex-direction:column}
.ev-card .top-band{height:5px}
.ev-card .b{padding:16px 18px;flex:1;display:flex;flex-direction:column;gap:12px}
.ev-card h3{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--azul)}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.ev-meta span{display:inline-flex;align-items:center;gap:5px}
.countdown-mini{display:flex;align-items:baseline;gap:4px;font-weight:700;color:var(--azul)}
.countdown-mini b{font-size:28px;line-height:1}

/* Ficha del evento */
.ev-head{padding:22px 24px;margin-bottom:18px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;position:relative;overflow:hidden}
.ev-head .cat-ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none}
.ev-head .info{flex:1;min-width:240px}
.ev-head h1{font-family:var(--serif);font-weight:400;font-size:28px;color:var(--azul)}
.ev-head .acts{display:flex;gap:8px;flex-wrap:wrap}
.ev-head .causa{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-size:14px;color:var(--texto);background:var(--oro-50);padding:5px 12px;border-radius:8px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--muted);margin-bottom:10px;cursor:pointer;border:0;background:none;padding:0}
.back:hover{color:var(--azul)}
.lockbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:#EEF2F8;border:1px dashed #B9C6DA;margin-bottom:16px;font-size:14px;color:var(--azul)}

/* Cuenta regresiva */
.cd{display:flex;gap:14px;flex-wrap:wrap}
.cd .u{min-width:96px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.12);text-align:center}
.cd .u b{display:block;font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cd .u span{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.hero{padding:26px 28px;border-radius:var(--r-lg);color:#fff;background:linear-gradient(135deg,var(--azul) 0%,#1D5BB8 100%);position:relative;overflow:hidden}
.hero .rueda-w{position:absolute;right:-60px;top:-60px;width:300px;opacity:.09}
.hero h2{font-family:var(--serif);font-weight:400;font-size:24px;margin-bottom:4px}
.hero p{margin:0 0 18px;opacity:.85}

/* Post-it */
.postits{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.postit{position:relative;min-height:110px;padding:14px 14px 30px;border-radius:4px 4px 14px 4px;box-shadow:0 6px 14px rgba(0,0,0,.08);font-size:14px;line-height:1.45;transform:rotate(-.6deg)}
.postit:nth-child(2n){transform:rotate(.8deg)}
.postit .x{position:absolute;right:6px;top:6px;border:0;background:none;cursor:pointer;opacity:.45}
.postit .x:hover{opacity:1}
.postit small{position:absolute;bottom:8px;left:14px;font-size:11px;opacity:.6}

/* Tareas */
.task{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-bottom:1px solid var(--borde-2)}
.task:last-child{border-bottom:0}
.task .chk{width:24px;height:24px;border-radius:7px;border:2px solid #B8C2D3;background:#fff;flex:none;cursor:pointer;display:grid;place-items:center;margin-top:1px;transition:.15s}
.task .chk:hover{border-color:var(--ok)}
.task.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.task .grow{flex:1;min-width:0}
.task .tt{font-weight:600}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .nl{font-size:13.5px;color:var(--muted);margin-top:2px}
.task .nl b{color:var(--texto);font-weight:600}
.task .acts{display:flex;gap:6px;align-items:center;flex:none}
.task-grp{padding:10px 18px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:#F7F9FC;border-bottom:1px solid var(--borde-2);display:flex;align-items:center;gap:8px}

/* Modal */
#modal-root .ov{position:fixed;inset:0;background:rgba(14,30,60,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein2 .2s}
@keyframes fadein2{from{opacity:0}}
.modal{width:100%;max-width:560px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:#fff;border-radius:16px;box-shadow:var(--sh-3);animation:pop .22s ease}
.modal.wide{max-width:820px} .modal.xl{max-width:1080px}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--borde-2)}
.modal-h h3{flex:1;font-size:18px;font-family:var(--serif);font-weight:400;color:var(--azul)}
.modal-b{padding:20px 22px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--borde-2);background:#FAFBFD;border-radius:0 0 16px 16px}
.modal-f .sp{flex:1}
.x-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;display:grid;place-items:center}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 14px}
.fld{display:flex;flex-direction:column;gap:6px;grid-column:span 2}
.fld.half{grid-column:span 1}
.fld label{font-size:13px;font-weight:700;color:var(--texto)}
.fld .hint{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{height:44px;border-radius:10px;border:1px solid var(--borde);background:#fff;padding:0 12px;font-size:15px;width:100%}
.fld textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.fld .ck{display:flex;align-items:center;gap:10px;height:44px;font-weight:600;cursor:pointer}
.fld .ck input{width:20px;height:20px}
.fld .money{position:relative} .fld .money span{position:absolute;left:12px;top:11px;color:var(--muted)} .fld .money input{padding-left:28px}
.fld-sep{grid-column:span 2;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);padding-top:6px;border-top:1px solid var(--borde-2)}
.meta-por{font-size:12px;color:var(--muted-2);margin-top:12px}

/* Toast */
#toast-root{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--azul-900);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--sh-3);font-size:14px;animation:pop .25s ease;max-width:92vw}
.toast.ok svg{color:#6EE0A8} .toast.bad{background:#8E2626}

/* Gráficos */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.bars-h .bh{display:grid;grid-template-columns:minmax(110px,180px) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.bars-h .bh .bar{height:10px;border-radius:6px;background:#E7EBF2;overflow:hidden}
.bars-h .bh .bar i{display:block;height:100%;border-radius:6px}

/* ---------- Plano de mesas ---------- */
.plano-wrap{display:flex;gap:16px;align-items:flex-start}
.plano-box{flex:1;min-width:0;position:relative}
.plano-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--borde-2)}
.plano-scroll{overflow:auto;height:min(72vh,780px);background:#EDF1F7;border-radius:0 0 var(--r) var(--r);-webkit-overflow-scrolling:touch}
.plano-sizer{position:relative}
.plano{position:absolute;left:0;top:0;transform-origin:0 0;background-color:#FBFCFE;background-image:linear-gradient(#E9EEF5 1px,transparent 1px),linear-gradient(90deg,#E9EEF5 1px,transparent 1px);background-size:40px 40px;border:1px solid #D5DCE7;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.mesa{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.mesa:active{cursor:grabbing}
.mesa svg{display:block;overflow:visible}
.mesa .mn{font-size:12.5px;font-weight:700;color:var(--azul);margin-top:2px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.mesa .tags{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:190px;margin-top:3px}
.mesa .tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:9px;color:#fff;cursor:pointer;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis;line-height:16px}
.mesa .tag:hover{filter:brightness(1.1);text-decoration:line-through}
.mesa.target svg .tbl{stroke:var(--oro);stroke-width:3.5}
.mesa.target{filter:drop-shadow(0 0 10px rgba(247,168,27,.55))}
.mesa.dragging{opacity:.85;z-index:5;cursor:grabbing}
.elem{position:absolute;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;border-radius:10px;border:2px dashed;font-weight:700;font-size:13px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;text-align:center;padding:4px;line-height:1.2}
.elem svg{width:22px;height:22px}
.sinasig{width:300px;flex:none;position:sticky;top:calc(var(--top) + 12px);max-height:calc(100vh - var(--top) - 40px);display:flex;flex-direction:column}
.sinasig .lst{overflow:auto;padding:8px}
.grp-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid transparent;background:none;cursor:pointer;text-align:left}
.grp-item:hover{background:var(--bg)}
.grp-row{display:flex;align-items:center;gap:4px}
.grp-row .grp-item{flex:1;min-width:0}
.mesa-pick button span{display:block}
.grp-item.sel{border-color:var(--oro);background:var(--oro-50)}
.grp-item .n{margin-left:auto;font-weight:700;font-size:13px;color:var(--muted)}
.plano-hint{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);z-index:6;background:var(--azul-900);color:#fff;padding:9px 16px;border-radius:22px;font-size:13.5px;box-shadow:var(--sh-3);display:flex;gap:10px;align-items:center;white-space:nowrap}
.sumbar{display:flex;gap:6px 20px;flex-wrap:wrap;padding:12px 16px;font-size:14px;border-top:1px solid var(--borde-2);background:#FAFBFD;border-radius:0 0 var(--r) var(--r)}
.sumbar b{color:var(--azul)}

/* ---------- Rifa: grilla de números ---------- */
.ngrid-blk{margin-bottom:18px}
.ngrid-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;margin-bottom:8px}
.ngrid{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:4px}
.nc{height:32px;border-radius:6px;border:0;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;transition:transform .12s;padding:0}
.nc:hover{transform:scale(1.12);position:relative;z-index:2;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.nc.libre{background:#fff;color:#9AA4B8;box-shadow:inset 0 0 0 1px #DDE3EC}
.nc.asignado{background:#DCE7F7;color:#33568F}
.nc.pago{background:var(--ok);color:#fff}
.nc.pendiente{background:var(--warn);color:#3D2C00}
.nc.anulado{background:#F3D4D4;color:#B33232;text-decoration:line-through}
.nc.ganador{background:var(--oro);color:var(--azul-900);box-shadow:0 0 0 2px var(--azul)}
.nc.hl{outline:3px solid var(--azure);outline-offset:1px}
.nc.dim{opacity:.18}
.nleg{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px}
.nleg i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:6px}

/* ---------- Pantalla de sorteo (proyectar) ---------- */
.stage{position:fixed;inset:0;z-index:80;overflow-y:auto;background:radial-gradient(1000px 600px at 50% 0%,#2357AE 0%,transparent 70%),var(--azul-900);color:#fff;display:flex;flex-direction:column;overflow:hidden}
.stage .rueda-fondo{position:absolute;width:120vmin;left:50%;top:50%;margin:-60vmin 0 0 -60vmin;opacity:.05;animation:girar 120s linear infinite;pointer-events:none}
.stage-top{display:flex;align-items:center;gap:14px;padding:18px 26px;position:relative;z-index:2}
.stage-top .lg{background:#fff;border-radius:10px;padding:6px 12px;display:flex}
.stage-top .lg svg{height:34px;width:auto}
.stage-top h2{font-family:var(--serif);font-weight:400;font-size:clamp(18px,2.4vw,28px);flex:1}
.stage-b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(22px,2.4vh);padding:20px;position:relative;z-index:2;text-align:center}
.stage .premio-lbl{font-size:clamp(14px,1.8vw,20px);letter-spacing:.2em;text-transform:uppercase;color:var(--oro);font-weight:700}
.stage .premio{font-family:var(--serif);font-size:clamp(24px,min(4.6vw,6.5vh),58px);line-height:1.1;max-width:1100px}
.reels{display:flex;gap:clamp(8px,1.5vw,18px)}
.reel{width:clamp(70px,min(11vw,16vh),150px);height:clamp(96px,min(15vw,22vh),200px);border-radius:18px;background:#fff;color:var(--azul);display:grid;place-items:center;font-size:clamp(56px,min(10vw,15vh),140px);font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 -8px 0 rgba(23,69,143,.08);position:relative;overflow:hidden}
.reel.spin span{animation:blur .08s linear infinite}
@keyframes blur{50%{opacity:.55;transform:translateY(-6%)}}
.reel.stop{animation:land .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(1.08)}100%{transform:scale(1)}}
.winner{min-height:120px;display:flex;flex-direction:column;align-items:center;gap:6px}
.winner .nm{font-size:clamp(26px,4vw,52px);font-weight:700;color:var(--oro);animation:fadein .6s ease}
.winner .sb{font-size:clamp(14px,1.6vw,20px);opacity:.85}
.stage-f{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:18px;position:relative;z-index:2}
.stage .btn{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff}
.stage .btn:hover{background:rgba(255,255,255,.18)}
.stage .btn-p{background:var(--oro);border-color:var(--oro);color:var(--azul-900)}
.stage-list{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:1100px}
.stage-list .pz{padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.08);font-size:13px}
.stage-list .pz.done{background:rgba(247,168,27,.2);color:#FFE2A8}
.stage-list .pz.cur{background:var(--oro);color:var(--azul-900);font-weight:700}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- Remate en vivo ---------- */
.vivo{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.vivo .lote-v{padding:0;overflow:hidden}
.foto{position:relative;aspect-ratio:4/3;display:grid;place-items:center;border-radius:10px;overflow:hidden}
.foto svg.big{width:34%;height:auto;opacity:.9}
.foto .nlote{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);color:var(--azul);font-weight:800;padding:4px 10px;border-radius:8px;font-size:14px}
.foto .ph{position:absolute;right:10px;bottom:8px;font-size:11px;opacity:.7}
.oferta{font-size:clamp(44px,7vw,84px);font-weight:800;color:var(--azul);font-variant-numeric:tabular-nums;line-height:1}
.bid-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bid-btns .btn{height:72px;font-size:22px;border-radius:14px}
.paletas{display:flex;flex-wrap:wrap;gap:6px}
.paletas button{min-width:46px;height:40px;border-radius:9px;border:1.5px solid var(--borde);background:#fff;font-weight:800;cursor:pointer}
.paletas button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.pujas{max-height:170px;overflow:auto;font-size:14px}
.pujas div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--borde-2)}
.vivo-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vivo-kpis div{padding:12px;border-radius:12px;background:var(--azul-50);text-align:center}
.vivo-kpis b{display:block;font-size:22px;color:var(--azul)}
.vivo-kpis span{font-size:12px;color:var(--muted)}
.vivo-full{position:fixed;inset:0;z-index:80;background:var(--bg);padding:18px 22px;overflow:auto}
.vivo .lote-v .foto{aspect-ratio:16/9;max-height:34vh;border-radius:0}

/* Lotes */
.lotes-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lote{padding:12px;display:flex;flex-direction:column;gap:8px}
.lote h4{font-size:15px}
.lote .drag{cursor:grab;color:var(--muted-2)}
.lote.over{outline:2px dashed var(--azure)}

/* Cronograma */
.crono{position:relative;padding-left:8px}
.crono-it{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--borde);margin-bottom:10px;position:relative}
.crono-it .h{font-weight:800;color:var(--azul);font-size:18px;min-width:62px;font-variant-numeric:tabular-nums}
.crono-it .grip{cursor:grab;color:var(--muted-2);padding-top:3px}
.crono-it.over{border-color:var(--azure);box-shadow:0 0 0 3px rgba(0,103,200,.15)}

/* Ingreso en puerta */
.puerta{max-width:760px;margin:0 auto}
.puerta .big-s{position:relative}
.puerta .big-s input{width:100%;height:60px;font-size:20px;border-radius:16px;border:2px solid var(--borde);padding:0 18px 0 52px}
.puerta .big-s svg{position:absolute;left:18px;top:19px;width:24px;height:24px;color:var(--muted)}
.puerta-cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.puerta-cnt div{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:12px;text-align:center}
.puerta-cnt b{display:block;font-size:28px;color:var(--azul);line-height:1.1}
.pg{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1px solid var(--borde);border-radius:14px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left}
.pg.llego{background:var(--ok-50);border-color:#BFE3CF}
.pg .mesa-b{margin-left:auto;text-align:right;font-weight:800;color:var(--azul);font-size:17px;white-space:nowrap}

/* Documentos imprimibles (rendición, actas, cartas, catálogo) */
.doc{background:#fff;max-width:820px;margin:0 auto;padding:44px 52px;border:1px solid var(--borde);box-shadow:var(--sh-2);border-radius:6px;color:#1F2A44;font-size:14px}
.doc .dh{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:3px solid var(--oro);padding-bottom:16px;margin-bottom:22px}
.doc .dh svg{height:64px;width:auto}
.doc .dh .r{text-align:right;font-size:12px;color:var(--muted)}
.doc h1{font-family:var(--serif);font-weight:400;font-size:28px;color:var(--azul);margin-bottom:4px}
.doc h2{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--azul);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--borde)}
.doc .lead{color:var(--muted);margin:0 0 6px}
.doc p{margin:0 0 10px;line-height:1.65}
.doc .letter p{font-family:var(--serif);font-size:15.5px;line-height:1.75}
.doc .dk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.doc .dk div{border:1px solid var(--borde);border-radius:10px;padding:12px;text-align:center}
.doc .dk b{display:block;font-size:19px;color:var(--azul);font-variant-numeric:tabular-nums}
.doc .dk span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.doc .dk div.hl{background:var(--azul);border-color:var(--azul)} .doc .dk div.hl b,.doc .dk div.hl span{color:#fff}
.doc table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
.doc th{background:var(--azul);color:#fff;text-align:left;padding:7px 9px;font-weight:600;font-size:12px}
.doc td{padding:7px 9px;border-bottom:1px solid var(--borde-2)}
.doc tfoot td{font-weight:700;border-top:2px solid var(--azul);background:#F4F6F9}
.doc .num{text-align:right}
.doc .firmas{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:30px;margin-top:56px}
.doc .firmas div{border-top:1px solid #1F2A44;padding-top:6px;text-align:center;font-size:12.5px}
.doc .firmas small{display:block;color:var(--muted)}
.doc .df{margin-top:34px;padding-top:12px;border-top:1px solid var(--borde);display:flex;justify-content:space-between;font-size:11px;color:var(--muted-2)}
.doc .cards-d{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.doc .cards-d .cd-it{border:1px solid var(--borde);border-radius:10px;overflow:hidden;break-inside:avoid}
.doc .cards-d .cd-it .foto{border-radius:0;aspect-ratio:16/9}
.doc .cards-d .cd-it .tx{padding:10px 12px}
.doc .cards-d .cd-it h4{font-family:var(--serif);font-weight:400;font-size:16px;color:var(--azul)}
.doc .cover{text-align:center;padding:40px 0 30px;border-bottom:1px solid var(--borde);margin-bottom:22px}
.doc .cover svg{height:110px;width:auto}
.doc .plano-d{border:1px solid var(--borde);border-radius:8px;overflow:hidden}
.doc .plano-d svg{width:100%;height:auto;display:block}
.doc .tblock{break-inside:avoid}
.doc .pb{break-before:page}
.doc-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
#print-root{display:none}
/* Pie de los documentos: logo de WYDAN */
.doc .df{align-items:center}
.df-wydan{display:inline-flex;align-items:center;gap:7px}
.df-wydan img{height:26px;width:auto;display:block}

/* Reportes */
.rep{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.rep .ri{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.rep h4{font-size:15px;margin-bottom:2px}
.rep p{margin:0;font-size:13px;color:var(--muted)}

/* Varios */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.pill-n{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:7px;background:var(--azul-50);color:var(--azul);font-weight:800;font-size:12.5px}
.fade-in{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.fade-in.vis{opacity:1;transform:none}
.sheet-more{position:fixed;left:0;right:0;bottom:0;z-index:55;background:#fff;border-radius:18px 18px 0 0;box-shadow:var(--sh-3);padding:10px 12px calc(16px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}}
.mesa-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.mesa-pick button{padding:10px;border-radius:10px;border:1.5px solid var(--borde);background:#fff;cursor:pointer;text-align:left}
.mesa-pick button b{display:block}
.mesa-pick button.full{opacity:.5}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  #panel-r1,#panel-r3{grid-template-columns:minmax(0,1fr)!important}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vivo{grid-template-columns:1fr}
}
@media (max-width:900px){
  :root{--top:58px}
  .grid[style*="grid-template-columns:minmax(0,1fr) minmax"],.grid[style*="grid-template-columns:minmax(0,1.5fr)"],.grid[style*="grid-template-columns:minmax(0,1.4fr)"],.grid[style*="grid-template-columns:minmax(0,1fr) minmax(0,2"]{grid-template-columns:minmax(0,1fr)!important}
  .side{display:none}
  .main{margin-left:0;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .top{padding:0 14px;gap:10px}
  .top .mob-logo{display:flex} .top .mob-logo svg{height:34px;width:34px}
  .user-chip .tx{display:none} .user-chip{padding:3px;border:0;background:none}
  .content{padding:16px}
  .page-head h1{font-size:25px}
  .g3,.g2{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .cats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .cat{padding:12px 10px;text-align:center}
  .cat .cat-ico{width:42px;height:42px;margin:0 auto 6px}
  .cat h3{font-size:15px} .cat p,.cat .cnt{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--borde);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer;position:relative}
  .bnav button.on{color:var(--azul)}
  .bnav button.on svg{color:var(--azul)}
  .bnav .badge{position:absolute;top:0;right:calc(50% - 22px);min-width:18px;height:18px;font-size:10.5px;padding:0 5px}
  .sinasig{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:55vh;z-index:45;border-radius:18px 18px 0 0;box-shadow:var(--sh-3)}
  .sinasig.closed{display:none}
  .plano-scroll{height:62vh}
  .doc{padding:24px 18px}
  .doc .dk{grid-template-columns:repeat(2,1fr)}
  .doc .cards-d{grid-template-columns:1fr}
  .ev-head{padding:16px;gap:12px}
  .ev-head h1{font-size:22px}
  .ev-head>.cat-ico{width:44px;height:44px}
  .ev-head .acts{flex-direction:row!important;align-items:center!important;width:100%;flex-wrap:wrap}
  .ev-head .ev-meta span:nth-child(n+3){display:none}
  .modal-b{padding:16px}
  #modal-root .ov{padding:0;align-items:flex-end}
  .modal{max-height:94vh;border-radius:18px 18px 0 0}
  .modal-f{border-radius:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .cd .u{min-width:70px;padding:10px} .cd .u b{font-size:32px}
}
@media (max-width:600px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 14px} .kpi .val{font-size:21px} .kpi .ico{display:none}
  .form{grid-template-columns:1fr} .fld.half{grid-column:span 2}
  .ngrid{grid-template-columns:repeat(10,minmax(0,1fr))}
  .nc{height:34px}
  .bid-btns .btn{height:64px;font-size:19px}
  .search{max-width:none}
  .li{padding:12px 14px} .task{padding:12px 14px}
  .card-h{padding:14px} .card-b{padding:14px}
  .hide-m{display:none!important}
  .puerta-cnt b{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  #lock .rueda-fondo,.stage .rueda-fondo{animation:none}
  .fade-in{opacity:1;transform:none}
}

/* ---------- Impresión (A4) ---------- */
@page{size:A4;margin:14mm}
@media print{
  body{background:#fff}
  body.printing>*:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
  #print-root .doc{box-shadow:none;border:0;padding:0;max-width:none;margin:0}
  #print-root .doc+.doc{break-before:page}
  .df-wydan img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print-root .doc{background:transparent}
  #print-root .doc.una-hoja{break-inside:avoid;page-break-inside:avoid}
  .doc.una-hoja .dh{padding-bottom:6px;margin-bottom:8px}
  .doc.una-hoja .dh svg{height:38px}
  .doc.una-hoja h1{font-size:19px;margin:0}
  .doc.una-hoja .lead{margin:0 0 4px}
  .doc.una-hoja .plano-d svg{max-height:132mm;width:auto;max-width:100%;margin:0 auto}
  .doc.una-hoja p{margin:4px 0 0;font-size:11px}
  .doc.una-hoja .df{margin-top:6px;padding-top:6px}
  .doc table{page-break-inside:auto} .doc tr{break-inside:avoid}
  .foto{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc th,.doc .dk div.hl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Versión pública: el emblema de fondo queda quieto */
#lock .rueda-fondo,.stage .rueda-fondo{animation:none}

</style>

const $ = (s, el = document) => el.querySelector(s);

function numeroATexto(n) { // para actas y cartas (montos)
  n = Math.round(n);
  const u = ['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const d = ['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const c = ['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const tres = x => { if (x === 0) return ''; if (x === 100) return 'cien'; const C = Math.floor(x / 100), r = x % 100; let s = c[C]; if (r) { s += (s ? ' ' : '') + (r < 30 ? u[r] : d[Math.floor(r / 10)] + (r % 10 ? ' y ' + u[r % 10] : '')); } return s; };
  if (n === 0) return 'cero';
  const mill = Math.floor(n / 1e6), mil = Math.floor((n % 1e6) / 1000), resto = n % 1000;
  let s = '';
  if (mill) s += (mill === 1 ? 'un millón' : tres(mill) + ' millones') + ' ';
  if (mil) s += (mil === 1 ? 'mil' : tres(mil).replace(/uno$/, 'un') + ' mil') + ' ';
  s += tres(resto);
  return s.trim().replace(/uno$/, 'uno');
}


/* =====================================================================
   3) CAPA DE DATOS  ·  "Store"
   ---------------------------------------------------------------------
   Toda la interfaz lee y escribe SOLO a través de estas funciones:
     Store.list(col, filtro) · Store.get(col, id) · Store.create(col, obj)
     Store.update(col, id, cambios) · Store.remove(col, id) · Store.cfg()
   Para pasar a una base de datos real alcanza con escribir otro "adapter"
   (mismo contrato load / save) y no hay que tocar el frontend.
   Hoy: datos de ejemplo en memoria + copia en este navegador (localStorage),
   para que la demo no se pierda al recargar. Botón "Restablecer datos" en Configuración.
   ===================================================================== */
const DATA_VERSION = 7;
const COLECCIONES = ['socios','colaboradores','eventos','tareas','invitados','mesas','elementos','gastos','compras','cronograma',
  'provEvento','entregas','rendiciones','numeros','talonarios','premios','lotes','postores','ofertas','movimientos','notas','log'];

const LocalAdapter = {
  KEY: 'club-solidario-rivera-gestion',
  load() { try { const s = localStorage.getItem(this.KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) { /* sin espacio o modo privado: sigue en memoria */ } },
  clear() { try { localStorage.removeItem(this.KEY); } catch (e) {} }
};

/* >>> OPCIONAL · NUBE (activar solo si el cliente contrata la persistencia)
   Proyecto Firebase en la cuenta de Wydan, con respaldos automáticos.
   1) Cargar los SDK de Firebase (app, auth, firestore) desde CDN.
   2) Completar FIREBASE_CONFIG y cambiar `Store.adapter = FirebaseAdapter` en el arranque.
   3) Login real: firebase.auth().signInWithEmailAndPassword(email, pass) en lugar de DEMO_PASSWORD,
      leyendo el rol del usuario desde la colección "usuarios" (presidente / tesorero / secretario).
   const FIREBASE_CONFIG = { apiKey:'', authDomain:'', projectId:'', appId:'' };
   const FirebaseAdapter = {
     async load() { const snap = await db.doc('clubes/rivera-este').get(); return snap.exists ? snap.data() : null; },
     save: debounce(d => db.doc('clubes/rivera-este').set(d), 800)   // ideal: una colección por tipo de registro
   };
*/

const Store = (() => {
  let D = null, idx = {};
  const subs = [];
  let user = null, ver = 0;
  const adapter = LocalAdapter;
  const guardar = debounce(() => adapter.save(D), 350);

  function reindex() { idx = {}; for (const c of COLECCIONES) { D[c] = D[c] || []; idx[c] = new Map(D[c].map(x => [x.id, x])); } }
  function notify(opts = {}) { ver++; guardar(); if (!opts.silent) subs.forEach(f => f(opts)); }
  const ahora = () => new Date().toISOString();

  return {
    init(seedFn) {
      const g = adapter.load();
      D = (g && g.version === DATA_VERSION) ? g : seedFn();
      reindex(); ver++; adapter.save(D);
    },
    reset(seedFn) { adapter.clear(); D = seedFn(); reindex(); adapter.save(D); notify(); },
    setUser(u) { user = u; }, ver: () => ver, user: () => user,
    on(fn) { subs.push(fn); },
    list(col, f) { return f ? D[col].filter(f) : D[col]; },
    get(col, id) { return id ? idx[col].get(id) : undefined; },
    create(col, obj, opts = {}) {
      const o = { id: obj.id || uid(col.slice(0, 2)), ...obj };
      if (!opts.sinAutor && user) { o.por = user.nombre; o.porRol = user.rol; o.creado = ahora(); }
      D[col].push(o); idx[col].set(o.id, o); notify(opts); return o;
    },
    update(col, id, cambios, opts = {}) {
      const o = idx[col].get(id); if (!o) return null;
      Object.assign(o, cambios);
      if (!opts.silent && user) { o.editPor = user.nombre; o.editado = ahora(); }
      notify(opts); return o;
    },
    remove(col, id, opts = {}) { const i = D[col].findIndex(x => x.id === id); if (i >= 0) { D[col].splice(i, 1); idx[col].delete(id); notify(opts); } },
    removeWhere(col, f, opts = {}) { const del = D[col].filter(f); D[col] = D[col].filter(x => !f(x)); del.forEach(x => idx[col].delete(x.id)); if (del.length) notify(opts); return del.length; },
    bulk(fn) { fn(); notify(); },                       // varios cambios, una sola actualización de pantalla
    cfg() { return D.config; },
    setCfg(cambios) { Object.assign(D.config, cambios); notify(); },
    club() { return D.club; },
    setClub(c) { Object.assign(D.club, c); notify(); },
    usuarios() { return D.usuarios; },
    registrar(accion, detalle, eventoId) { // registro de cambios (auditoría)
      const o = { id: uid('lg'), fecha: ahora(), quien: user ? `${user.nombre} (${user.rol})` : 'Sistema', accion, detalle, eventoId };
      D.log.unshift(o); idx.log.set(o.id, o); if (D.log.length > 400) D.log.length = 400; guardar();
    },
    raw: () => D
  };
})();

const _memo = { v: -1, m: {} };

    const p = Store.get('postores', pid) || { nombre: '—', paleta: '?' };
    const total = sum(ls, l => totalLote(l, ev)), cobrado = sum(ls, l => cobradoLote(l, ev));
    const est = ls.every(l => l.pagado) ? 'Pagado' : ls.some(l => estadoCobroLote(l) === 'Vencido') ? 'Vencido' : 'Pendiente';
    return { postor: p, lotes: ls, subtotal: sum(ls, l => l.final), comision: total - sum(ls, l => l.final), total, cobrado, saldo: total - cobrado, estado: est, entregados: ls.filter(l => l.entregado).length };
  }).sort((a, b) => (a.postor.paleta || 0) - (b.postor.paleta || 0));
}

/* ---------- FINANZAS DE UN EVENTO ----------
   Ingresos = automáticos (tarjetas / números / lotes) + manuales (sponsors, donaciones, barra…)
   Gastos   = presupuesto (ítems) + compras + egresos cargados al evento
   Resultado neto = ingresos – gastos.  Recaudado = lo efectivamente cobrado. */
const pagadoGasto = g => g.estado === 'Pagado' ? g.total : (g.estado === 'Señado' ? (g.sena || 0) : 0);
function gastosEvento(evId) {
  return memo('ge' + evId, () => ({
    items: Store.list('gastos', g => g.eventoId === evId),
    compras: Store.list('compras', c => c.eventoId === evId),
    movs: Store.list('movimientos', m => m.eventoId === evId && m.tipo === 'egreso')
  }));
}
function finEvento(ev) {
  return memo('fe' + ev.id, () => {
    const G = gastosEvento(ev.id);
    const gTotal = sum(G.items, g => g.total) + sum(G.compras, c => c.cant * c.pu) + sum(G.movs, m => m.monto);
    const gPagado = sum(G.items, pagadoGasto) + sum(G.compras.filter(c => c.comprado), c => c.cant * c.pu) + sum(G.movs.filter(m => m.estado === 'Pagado'), m => m.monto);
    const otrosMov = Store.list('movimientos', m => m.eventoId === ev.id && m.tipo === 'ingreso' && !m.invitadoId && m.categoria !== 'Cuota de lote');
    const otros = { rows: otrosMov, total: sum(otrosMov, m => m.monto), cobrado: sum(otrosMov.filter(m => m.estado === 'Cobrado'), m => m.monto) };
    let auto = { label: '', vendido: 0, cobrado: 0, unidades: 0, unidadesTot: 0, precioProm: 0, unidad: CATEGORIAS[ev.cat].unidad };
    if (ev.cat === 'cena') {
      const inv = invitadosDe(ev.id), v = inv.filter(invVendido);
      auto = { ...auto, label: 'Tarjetas vendidas', vendido: sum(v, g => precioInv(g, ev)), cobrado: sum(v.filter(g => g.pago === 'Pagado'), g => precioInv(g, ev)), unidades: sum(v, personas) };
      auto.precioProm = auto.unidades ? auto.vendido / auto.unidades : ev.cfg.precios.general;
    } else if (ev.cat === 'rifa') {
      const s = statsRifa(ev);
      auto = { ...auto, label: 'Números vendidos', vendido: s.vendidos * ev.cfg.precio, cobrado: s.recaudado, unidades: s.vendidos, unidadesTot: s.total - s.anulado, precioProm: ev.cfg.precio };
    } else {
      const s = statsRemate(ev);
      auto = { ...auto, label: 'Lotes adjudicados', vendido: s.rematado, cobrado: s.cobrado, unidades: s.adj.length, unidadesTot: s.total, precioProm: s.adj.length ? s.rematado / s.adj.length : (s.total ? s.baseTotal / s.total : 0) };
    }
    const ingresos = auto.vendido + otros.total, recaudado = auto.cobrado + otros.cobrado;
    // Punto de equilibrio: cuántas unidades hacen falta para cubrir los gastos (descontando otros ingresos)
    const necesario = Math.max(0, gTotal - otros.total);
    const unidadesEq = auto.precioProm ? Math.ceil(necesario / auto.precioProm) : 0;
    return { G, gTotal, gPagado, gPend: gTotal - gPagado, otros, auto, ingresos, recaudado, porCobrar: ingresos - recaudado,
      resultado: ingresos - gTotal, caja: recaudado - gPagado, meta: ev.meta || 0, pctMeta: pct(recaudado, ev.meta),
      eq: { necesario, unidades: unidadesEq, faltan: Math.max(0, unidadesEq - auto.unidades), cubierto: auto.unidades >= unidadesEq } };
  });
}

/* ---------- LIBRO ÚNICO DE MOVIMIENTOS (alimenta Finanzas del club) ----------
   Une: movimientos manuales + rendiciones de vendedores + cobros de lotes + gastos de eventos.
   Lo pendiente queda como Pendiente/Vencido y NO impacta en caja hasta que se cobra o paga. */
function ledger() {
  return memo('ledger', () => {
    const rows = [];
    const add = o => rows.push(o);
    Store.list('movimientos', m => m.tipo !== 'traspaso').forEach(m => {
      let estado = m.estado;
      if (m.tipo === 'ingreso' && estado === 'Pendiente' && m.vence && m.vence < HOY_ISO) estado = 'Vencido';
      add({ key: 'mov:' + m.id, fuente: 'mov', ref: m.id, tipo: m.tipo, fecha: m.fecha, fechaEf: m.fechaEf, vence: m.vence, eventoId: m.eventoId, categoria: m.categoria, concepto: m.concepto, monto: m.monto, medio: m.medio, estado, quien: m.por || '', destinoDe: m.destinoDe, causa: m.causa });
    });
    Store.list('rendiciones').forEach(r => {
      const ev = Ev(r.eventoId); if (!ev) return;
      add({ key: 'ren:' + r.id, fuente: 'ren', ref: r.id, tipo: 'ingreso', fecha: r.fecha, fechaEf: r.fecha, eventoId: r.eventoId, categoria: ev.cat === 'cena' ? 'Tarjetas' : 'Números de rifa',
        concepto: `Rendición de ${ev.cat === 'cena' ? 'tarjetas' : 'números'} – ${nomSoc(r.socioId)}`, monto: r.monto, medio: r.medio, estado: 'Cobrado', quien: nomSoc(r.recibioId) });
    });
    Store.list('eventos').forEach(ev => {
      if (ev.estado === 'Cancelado') return;
      if (ev.cat === 'cena' || ev.cat === 'rifa') {
        const vs = ev.cat === 'cena' ? vendedoresCena(ev) : vendedoresRifa(ev);
        vs.filter(v => v.saldo > 0).forEach(v => add({ key: `sal:${ev.id}:${v.socioId}`, fuente: 'saldo', ref: v.socioId, tipo: 'ingreso', fecha: HOY_ISO, eventoId: ev.id, categoria: ev.cat === 'cena' ? 'Tarjetas' : 'Números de rifa',
          concepto: `Saldo a rendir – ${nomSoc(v.socioId)}`, monto: v.saldo, medio: 'Efectivo', estado: 'Pendiente', quien: '' }));
        let pend = 0, cant = 0;
        if (ev.cat === 'cena') { const ps = invitadosDe(ev.id).filter(g => g.pago === 'Pendiente' && g.estado === 'Confirmado'); pend = sum(ps, g => precioInv(g, ev)); cant = ps.length; }
        else { const s = statsRifa(ev); pend = s.porCobrar; cant = s.pendiente; }
        if (pend > 0) add({ key: `pc:${ev.id}`, fuente: 'porcobrar', ref: ev.id, tipo: 'ingreso', fecha: HOY_ISO, vence: ev.fecha, eventoId: ev.id, categoria: ev.cat === 'cena' ? 'Tarjetas' : 'Números de rifa',
          concepto: ev.cat === 'cena' ? `Tarjetas vendidas sin cobrar (${cant} grupos)` : `Números vendidos sin cobrar (${cant})`, monto: pend, medio: '', estado: ev.fecha < HOY_ISO ? 'Vencido' : 'Pendiente', quien: '' });
      }
      if (ev.cat === 'remate') lotesDe(ev.id).filter(adjudicado).forEach(l => {
        const p = Store.get('postores', l.postorId) || {};
        const tot = totalLote(l, ev), ya = l.cuotasCobradas || 0;
        const base = { tipo: 'ingreso', eventoId: ev.id, categoria: 'Lotes', medio: l.medio || '', quien: '' };
        if (l.pagado) add({ ...base, key: 'lot:' + l.id, fuente: 'lote', ref: l.id, fecha: l.fechaPago, fechaEf: l.fechaPago, concepto: `Lote ${l.n} – ${l.titulo} (paleta ${p.paleta})`, monto: tot - ya, estado: 'Cobrado' });
        else add({ ...base, key: 'lot:' + l.id, fuente: 'lote', ref: l.id, fecha: ev.fecha, vence: l.venceCobro, concepto: `Lote ${l.n} – ${l.titulo} (paleta ${p.paleta} · ${p.nombre})${ya ? ' · saldo' : ''}`, monto: tot - ya, estado: estadoCobroLote(l) });
      });
    });
    Store.list('gastos').forEach(g => {
      const ev = Ev(g.eventoId); if (!ev) return;
      const base = { tipo: 'egreso', eventoId: g.eventoId, categoria: g.cat, medio: g.medio || 'Transferencia', quien: nomSoc(g.pagadoPorId), proveedorId: g.proveedorId, gastoId: g.id };
      const prov = g.proveedorId ? ' · ' + nomCol(g.proveedorId) : '';
      if (g.sena > 0 && g.fechaSena) add({ ...base, key: 'sen:' + g.id, fuente: 'sena', ref: g.id, fecha: g.fechaSena, fechaEf: g.fechaSena, concepto: `Seña – ${g.item}${prov}`, monto: g.sena, estado: 'Pagado' });
      const resto = g.total - (g.sena > 0 && g.fechaSena ? g.sena : 0);
      if (resto <= 0) return;
      if (g.estado === 'Pagado') add({ ...base, key: 'gas:' + g.id, fuente: 'gasto', ref: g.id, fecha: g.fechaPago, fechaEf: g.fechaPago, concepto: `${g.sena ? 'Saldo – ' : ''}${g.item}${prov}`, monto: resto, estado: 'Pagado' });
      else add({ ...base, key: 'gas:' + g.id, fuente: 'gasto', ref: g.id, fecha: g.vence || ev.fecha, vence: g.vence, concepto: `${g.sena ? 'Saldo – ' : ''}${g.item}${prov}`, monto: resto, estado: 'Pendiente' });
    });
    Store.list('compras').forEach(c => {
      const ev = Ev(c.eventoId); if (!ev) return;
      add({ key: 'com:' + c.id, fuente: 'compra', ref: c.id, tipo: 'egreso', eventoId: c.eventoId, categoria: 'Compras', concepto: `Compra: ${c.item} (${c.cant} × ${money(c.pu)})`, monto: c.cant * c.pu,
        medio: 'Efectivo', estado: c.comprado ? 'Pagado' : 'Pendiente', fecha: c.fecha || c.vence || ev.fecha, fechaEf: c.comprado ? c.fecha : null, vence: c.vence, quien: '' });
    });
    return rows.sort((a, b) => (b.fechaEf || b.fecha || '').localeCompare(a.fechaEf || a.fecha || ''));
  });
}
const cuentaDe = medio => medio === 'Efectivo' ? 'ef' : 'bco';

/* ---------- FLUJO DE CAJA (solo lo real) ----------
   saldo inicial + cobros efectivamente cobrados – pagos efectivamente pagados = saldo final */
function flujoCaja() {
  return memo('caja', () => {
    const si = Store.cfg().saldoInicial;
    const reales = ledger().filter(r => (r.estado === 'Cobrado' || r.estado === 'Pagado') && r.fechaEf && r.fechaEf >= si.fecha && r.fechaEf <= HOY_ISO);
    const porMes = groupBy(reales, r => mesKey(r.fechaEf));
    const trasp = groupBy(Store.list('movimientos', m => m.tipo === 'traspaso' && m.fecha <= HOY_ISO), m => mesKey(m.fecha));
    const meses = []; let [y, m] = si.fecha.split('-').map(Number);
    const fin = mesKey(HOY_ISO);
    let ef = si.efectivo, bco = si.banco;
    while (true) {
      const k = `${y}-${pad(m)}`;
      const rs = porMes[k] || [];
      const c = { ef: 0, bco: 0 }, p = { ef: 0, bco: 0 };
      rs.forEach(r => (r.tipo === 'ingreso' ? c : p)[cuentaDe(r.medio)] += r.monto);
      const row = { mes: k, iniEf: ef, iniBco: bco, ini: ef + bco, cobEf: c.ef, cobBco: c.bco, cobros: c.ef + c.bco, pagEf: p.ef, pagBco: p.bco, pagos: p.ef + p.bco };
      const tr = sum(trasp[k] || [], t => t.desde === 'ef' ? t.monto : -t.monto);
      ef += c.ef - p.ef - tr; bco += c.bco - p.bco + tr; row.traspaso = tr;
      Object.assign(row, { finEf: ef, finBco: bco, fin: ef + bco, neto: row.cobros - row.pagos, movs: rs.length });
      meses.push(row);
      if (k === fin) break;
      m++; if (m > 12) { m = 1; y++; }
    }
    return { meses, ef, bco, saldo: ef + bco };
  });
}

/* ---------- Saldos a rendir (dinero que tienen los socios vendedores) ---------- */
function saldosARendir() {
  return memo('saldos', () => {
    const out = [];
    Store.list('eventos', e => (e.cat === 'cena' || e.cat === 'rifa') && e.estado !== 'Cancelado').forEach(ev => {
      (ev.cat === 'cena' ? vendedoresCena(ev) : vendedoresRifa(ev)).filter(v => v.saldo > 0).forEach(v => out.push({ socioId: v.socioId, eventoId: ev.id, monto: v.saldo }));
    });
    return out;
  });
}

/* ---------- Cuota social ---------- */
function estadoCuota(s) {
  return memo('cuota' + s.id, () => {
    const pagos = Store.list('movimientos', m => m.categoria === 'Cuota social' && m.socioId === s.id && m.estado === 'Cobrado').sort((a, b) => b.fecha.localeCompare(a.fecha));
    const pagados = new Set(pagos.flatMap(p => p.meses || []));
    if (!s.activo) return { estado: 'Licencia', clase: 'gray', pagos, atrasados: [], ultimo: [...pagados].sort().pop() };
    const desde = s.ingreso > Store.cfg().saldoInicial.fecha ? mesKey(s.ingreso) : mesKey(Store.cfg().saldoInicial.fecha);
    const d = pd(HOY_ISO); d.setDate(1); d.setMonth(d.getMonth() - 1); const hasta = mesKey(iso(d));
    const req = []; let [y, m] = desde.split('-').map(Number);
    while (`${y}-${pad(m)}` <= hasta) { req.push(`${y}-${pad(m)}`); m++; if (m > 12) { m = 1; y++; } }
    const atrasados = req.filter(k => !pagados.has(k));
    return { estado: atrasados.length ? 'Atrasado' : 'Al día', clase: atrasados.length ? 'bad' : 'ok', pagos, atrasados, ultimo: [...pagados].sort().pop(), deuda: atrasados.length * cfgPrecio('cuotaSocial') };
  });
}

/* ---------- Participación de un socio ---------- */
function participacion(sid) {
  const ts = Store.list('tareas', t => t.encargadoId === sid);
  const ventas = [];
  Store.list('eventos', e => e.cat === 'cena' || e.cat === 'rifa').forEach(ev => {
    const v = (ev.cat === 'cena' ? vendedoresCena(ev) : vendedoresRifa(ev)).find(x => x.socioId === sid);
    if (v) ventas.push({ ev, v });
  });
  return { tareas: ts, hechas: ts.filter(t => t.estado === 'Hecha').length, atrasadas: ts.filter(t => estadoTarea(t) === 'Atrasada').length, ventas,
    saldo: sum(ventas, x => Math.max(0, x.v.saldo)), coordina: Store.list('eventos', e => e.coordinadorId === sid) };
}

/* ---------- Historial de un colaborador ---------- */
function historialColab(cid) {
  const out = [];
  Store.list('movimientos', m => m.colaboradorId === cid && m.tipo === 'ingreso').forEach(m => out.push({ fecha: m.fecha, eventoId: m.eventoId, rol: m.categoria === 'Sponsor' ? 'Sponsor' : 'Donante', detalle: m.concepto, monto: m.monto, estado: m.estado }));
  Store.list('premios', p => p.donanteId === cid).forEach(p => { const ev = Ev(p.eventoId); out.push({ fecha: ev.fecha, eventoId: ev.id, rol: 'Donante', detalle: `${ordinal(p.orden)} premio: ${p.desc}`, monto: p.valor, estado: 'Valor estimado' }); });
  Store.list('lotes', l => l.donanteId === cid).forEach(l => { const ev = Ev(l.eventoId); out.push({ fecha: ev.fecha, eventoId: ev.id, rol: 'Donante', detalle: `Lote ${l.n}: ${l.titulo}`, monto: l.final || l.valor, estado: l.final ? 'Rematado' : l.estado }); });
  Store.list('gastos', g => g.proveedorId === cid).forEach(g => { const ev = Ev(g.eventoId); out.push({ fecha: g.fechaPago || g.fechaSena || g.vence || ev.fecha, eventoId: ev.id, rol: 'Proveedor', detalle: g.item, monto: g.total, estado: g.estado }); });
  const gen = groupBy(Store.list('movimientos', m => m.colaboradorId === cid && m.tipo === 'egreso' && !m.eventoId), m => m.fecha.slice(0, 4) + '|' + m.categoria);
  Object.entries(gen).forEach(([k, ms]) => { const [y, cat] = k.split('|'); out.push({ fecha: ms[ms.length - 1].fecha, eventoId: null, rol: 'Proveedor', detalle: `${cat} ${y} (${ms.length} ${ms.length === 1 ? 'pago' : 'pagos'})`, monto: sum(ms, m => m.monto), estado: ms.every(m => m.estado === 'Pagado') ? 'Pagado' : 'Pendiente' }); });
  return out.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
}

/* ---------- Alertas del panel ---------- */
function alertas() {
  return memo('alertas', () => {
    const A = [];
    const atr = Store.list('tareas', t => estadoTarea(t) === 'Atrasada');
    if (atr.length) A.push({ nivel: 'bad', ic: 'tareas', txt: `${atr.length} tareas atrasadas`, sub: uniq(atr.map(t => nomCorto(t.encargadoId))).slice(0, 4).join(', '), go: '#/tareas' });
    const venc = ledger().filter(r => r.tipo === 'ingreso' && r.estado === 'Vencido');
    if (venc.length) A.push({ nivel: 'bad', ic: 'peso', txt: `${venc.length} cobros vencidos por ${money(sum(venc, r => r.monto))}`, sub: venc.slice(0, 2).map(r => r.concepto).join(' · '), go: '#/finanzas/ingresos?estado=Vencido' });
    const sal = saldosARendir();
    if (sal.length) A.push({ nivel: 'warn', ic: 'billete', txt: `${uniq(sal.map(s => s.socioId)).length} socios con dinero sin rendir: ${money(sum(sal, s => s.monto))}`, sub: uniq(sal.map(s => nomSoc(s.socioId))).join(', '), go: '#/finanzas/ingresos?estado=Pendiente&q=Saldo' });
    const sem = ledger().filter(r => r.tipo === 'egreso' && r.estado === 'Pendiente' && r.vence && diasHasta(r.vence) <= 7);
    if (sem.length) A.push({ nivel: sem.some(r => r.vence < HOY_ISO) ? 'bad' : 'warn', ic: 'recibo', txt: `${sem.length} pagos a proveedores vencen esta semana`, sub: money(sum(sem, r => r.monto)), go: '#/finanzas/egresos?vence=7' });
    Store.list('eventos', e => e.cat === 'remate').forEach(ev => { const s = statsRemate(ev); if (s.sinEntregar.length && ev.estado !== 'En preparación') A.push({ nivel: 'warn', ic: 'caja', txt: `${s.sinEntregar.length} lotes sin entregar – ${ev.nombre}`, sub: s.sinEntregar.map(l => 'Lote ' + l.n).join(', '), go: `#/evento/${ev.id}/cobros` }); });
    const prox = proximaCena(); if (prox) { const s = statsCena(prox); if (s.sinMesa.length) A.push({ nivel: 'warn', ic: 'users', txt: `${s.sinMesa.length} grupos sin mesa en la ${prox.nombre}`, sub: `${sum(s.sinMesa, personas)} personas`, go: `#/evento/${prox.id}/mesas` }); }
    const atrCuota = Store.list('socios', s => s.activo && estadoCuota(s).estado === 'Atrasado');
    if (Store.cfg().reglas.cuotaActiva && atrCuota.length) A.push({ nivel: 'warn', ic: 'users', txt: `${atrCuota.length} socios con la cuota atrasada`, sub: atrCuota.map(s => s.nombre.split(' ')[0]).join(', '), go: '#/socios?cuota=Atrasado' });
    const neg = flujoCaja().meses.filter(m => m.fin < 0);
    if (neg.length) A.push({ nivel: 'bad', ic: 'alerta', txt: `La caja cerró en negativo en ${neg.length} mes(es)`, sub: neg.map(m => mesNombre(m.mes)).join(', '), go: '#/finanzas/caja' });
    return A;
  });
}
function proximaCena() { return Store.list('eventos', e => e.cat === 'cena' && e.fecha >= HOY_ISO && e.estado !== 'Cancelado').sort((a, b) => a.fecha.localeCompare(b.fecha))[0]; }
function proximo(cat) { return Store.list('eventos', e => e.cat === cat && e.fecha >= HOY_ISO && e.estado !== 'Cancelado').sort((a, b) => a.fecha.localeCompare(b.fecha))[0]; }
function ultimo(cat) { return Store.list('eventos', e => e.cat === cat && e.fecha < HOY_ISO).sort((a, b) => b.fecha.localeCompare(a.fecha))[0]; }

/* ---------- Altas de eventos ---------- */
function crearEvento(datos) {
  const cat = datos.cat;
  const cfg = cat === 'cena' ? { precios: { general: cfgPrecio('cenaGeneral'), socio: cfgPrecio('cenaSocio'), nino: cfgPrecio('cenaNino') }, limite: addDays(datos.fecha, -10), colores: {} }
    : cat === 'rifa' ? { cantidad: 1000, precio: cfgPrecio('rifaNumero'), porTalonario: 100, forma: 'interno', fechaQuiniela: '', autorizacion: '', repetir: Store.cfg().reglas.ganadorRepite, sorteada: null, testigos: '' }
    : { comision: cfgPrecio('comisionRemate'), silenciosa: false, cierreSilenciosa: '', honorario: '', cerrado: null, plazo: cfgPrecio('plazoPagoRemate') };
  let ev;
  Store.bulk(() => {
    ev = Store.create('eventos', { ...datos, cfg, obs: datos.obs || '' }, { silent: true });
    (Store.cfg().plantillas[cat] || []).forEach(p => Store.create('tareas', { eventoId: ev.id, desc: p.t, cat: p.c, encargadoId: null, vence: addDays(ev.fecha, -p.d), estado: 'Pendiente', nota: '', hechaEl: null }, { silent: true }));
    if (cat === 'rifa') for (let n = 0; n < cfg.cantidad; n++) Store.create('numeros', { id: `${ev.id}-${n}`, eventoId: ev.id, n, estado: 'libre', vendedorId: null, comprador: '', tel: '', ci: '', fecha: null }, { silent: true, sinAutor: true });
    if (cat === 'cena') {
      [['escenario', 490, 20], ['pista', 470, 110], ['entrada', 555, 975], ['barra', 1040, 965], ['banos', 30, 965]].forEach(([t, x, y]) => Store.create('elementos', { eventoId: ev.id, tipo: t, nombre: ELEMENTOS_PLANO[t].n, x, y, w: ELEMENTOS_PLANO[t].w, h: ELEMENTOS_PLANO[t].h }, { silent: true }));
      for (let i = 0; i < 12; i++) Store.create('mesas', { eventoId: ev.id, nombre: 'Mesa ' + (i + 1), cap: 10, forma: 'redonda', x: [30, 180, 330, 790, 940, 1090][i % 6], y: 110 + Math.floor(i / 6) * 200 }, { silent: true });
    }
  });
  Store.registrar('Evento creado', `${ev.nombre} (${CATEGORIAS[cat].singular}) con ${(Store.cfg().plantillas[cat] || []).length} tareas de plantilla`, ev.id);
  return ev;
}
/* Duplicar evento: arma la edición siguiente con tareas, mesas, precios, proveedores, cronograma y premios */
function duplicarEvento(src) {
  const sumaAnio = s => s.replace(/(20\d\d)/, (m, y) => String(+y + 1));
  const nuevaFecha = addDays(src.fecha, 364);
  const desfase = diffDays(src.fecha, nuevaFecha);
  let ev;
  Store.bulk(() => {
    const cfg = JSON.parse(JSON.stringify(src.cfg));
    if (src.cat === 'rifa') { cfg.sorteada = null; cfg.autorizacion = ''; }
    if (src.cat === 'remate') cfg.cerrado = null;
    if (src.cat === 'cena') cfg.limite = cfg.limite ? addDays(cfg.limite, desfase) : null;
    delete cfg.rendidaEl;
    ev = Store.create('eventos', { nombre: /20\d\d/.test(src.nombre) ? sumaAnio(src.nombre) : src.nombre + ' (copia)', cat: src.cat, fecha: nuevaFecha, hora: src.hora, lugar: src.lugar, causa: src.causa, coordinadorId: src.coordinadorId, meta: src.meta, estado: 'Planificación', obs: `Creado a partir de "${src.nombre}".`, cfg, origenId: src.id }, { silent: true });
    tareasDe(src.id).forEach(t => Store.create('tareas', { eventoId: ev.id, desc: t.desc, cat: t.cat, encargadoId: t.encargadoId, vence: t.vence ? addDays(t.vence, desfase) : null, estado: 'Pendiente', nota: '', hechaEl: null }, { silent: true }));
    Store.list('mesas', m => m.eventoId === src.id).forEach(m => Store.create('mesas', { eventoId: ev.id, nombre: m.nombre, cap: m.cap, forma: m.forma, x: m.x, y: m.y }, { silent: true }));
    Store.list('elementos', m => m.eventoId === src.id).forEach(m => Store.create('elementos', { ...m, id: undefined, eventoId: ev.id }, { silent: true }));
    Store.list('cronograma', m => m.eventoId === src.id).forEach(m => Store.create('cronograma', { ...m, id: undefined, eventoId: ev.id }, { silent: true }));
    Store.list('provEvento', m => m.eventoId === src.id).forEach(m => Store.create('provEvento', { ...m, id: undefined, eventoId: ev.id, estado: 'Pendiente', fecha: '' }, { silent: true }));
    Store.list('gastos', g => g.eventoId === src.id).forEach(g => Store.create('gastos', { ...g, id: undefined, eventoId: ev.id, estado: 'Pendiente', sena: 0, fechaSena: null, fechaPago: null, vence: addDays(g.vence || g.fechaPago || src.fecha, desfase), comprobante: false, nota: 'Monto de referencia de la edición anterior.' }, { silent: true }));
    Store.list('premios', p => p.eventoId === src.id).forEach(p => Store.create('premios', { ...p, id: undefined, eventoId: ev.id, ganadorN: null, ganador: '', ganadorTel: '', sorteadoEl: null }, { silent: true }));
    if (src.cat === 'rifa') for (let n = 0; n < cfg.cantidad; n++) Store.create('numeros', { id: `${ev.id}-${n}`, eventoId: ev.id, n, estado: 'libre', vendedorId: null, comprador: '', tel: '', ci: '', fecha: null }, { silent: true, sinAutor: true });
  });
  Store.registrar('Evento duplicado', `${ev.nombre} creado desde ${src.nombre}`, ev.id);
  return ev;
}

/* Datos de ejemplo: el tesorero deposita el efectivo en el banco a fin de mes (traspaso interno, no es ingreso ni egreso) */
function prepararTraspasosDemo() {

/* ---------- Dibujo de pantalla (conserva foco y scroll) ---------- */
function render(nuevaRuta) {
  if (!UI.user) return;
  const v = $('#view'); if (!v) return;
  const act = document.activeElement, actId = act && act.id && v.contains(act) ? act.id : null, selS = act && act.selectionStart;
  const sx = window.scrollX, sy = window.scrollY;
  $('#nav').innerHTML = navHTML(); $('#bnav').innerHTML = bnavHTML();
  const fn = Views[UI.ruta[0]] || Views.panel;
  _after = [];
  try { v.innerHTML = fn(); } catch (e) { console.error(e); v.innerHTML = `<div class="alert bad">${ic('alerta')} Ocurrió un error al mostrar esta pantalla: ${esc(e.message)}</div>`; }
  _after.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  if (nuevaRuta) window.scrollTo(0, 0); else window.scrollTo(sx, sy);
  if (actId) { const el = document.getElementById(actId); if (el) { el.focus(); try { if (selS != null) el.setSelectionRange(selS, selS); } catch (e) {} } }
  animarEntrada();
}
function animarEntrada() {
  if (reduceMotion() || !('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('vis'); io.unobserve(e.target); } }), { threshold: .05 });
  $$('#view .fade-in:not(.vis)').forEach(el => io.observe(el));
}
Store.on(opts => { if (!opts.noRender) render(); });
