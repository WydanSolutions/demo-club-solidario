const kfmt = v => Math.abs(v) >= 1e6 ? nf1.format(v / 1e6) + ' M' : Math.abs(v) >= 1000 ? nf.format(Math.round(v / 1000)) + ' mil' : nf.format(v);
function grafBarras({ labels, series, alto = 230, fmt = kfmt }) {
  const W = 720, H = alto, pl = 54, pr = 10, pt = 14, pb = 34;
  const max = Math.max(1, ...series.flatMap(s => s.values)), min = Math.min(0, ...series.flatMap(s => s.values));
  const rng = max - min, cw = (W - pl - pr) / labels.length, bw = Math.min(26, (cw * .72) / series.length);
  const y = v => pt + (max - v) / rng * (H - pt - pb);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = min + rng * i / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E7EBF2"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  labels.forEach((l, i) => {
    const x0 = pl + cw * i + (cw - bw * series.length) / 2;
    series.forEach((s, j) => { const v = s.values[i] || 0; const yy = y(Math.max(v, 0)), h = Math.abs(y(v) - y(0)); g += `<rect x="${x0 + j * bw}" y="${yy}" width="${bw - 3}" height="${Math.max(h, 0.5)}" rx="3" fill="${v < 0 ? '#D64545' : s.color}"><title>${esc(l)} · ${s.name}: ${money(v)}</title></rect>`; });
    if (labels.length <= 14 || i % Math.ceil(labels.length / 14) === 0) g += `<text x="${pl + cw * i + cw / 2}" y="${H - 12}" text-anchor="middle">${esc(l)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>` + (series.length > 1 ? `<div class="legend mt-s">${series.map(s => `<span><i class="dot" style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>` : '');
}
function grafLinea({ labels, values, color = '#17458F', alto = 230, umbral = null }) {
  const W = 720, H = alto, pl = 58, pr = 12, pt = 14, pb = 32;
  const max = Math.max(1, ...values), min = Math.min(0, ...values), rng = max - min || 1;
  const x = i => pl + (W - pl - pr) * (labels.length === 1 ? .5 : i / (labels.length - 1));
  const y = v => pt + (max - v) / rng * (H - pt - pb);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = min + rng * i / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E7EBF2"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
  if (min < 0) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="#D64545" stroke-dasharray="4 4"/>`;
  const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const gid = 'lg' + Math.random().toString(36).slice(2, 6);
  g += `<defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  g += `<polygon points="${x(0)},${y(Math.max(min, 0))} ${pts} ${x(values.length - 1)},${y(Math.max(min, 0))}" fill="url(#${gid})"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  values.forEach((v, i) => { const bad = v < 0, warn = umbral != null && v < umbral; g += `<circle cx="${x(i)}" cy="${y(v)}" r="${bad || warn ? 5 : 3}" fill="${bad ? '#D64545' : warn ? '#E0A100' : color}"><title>${esc(labels[i])}: ${money(v)}</title></circle>`; });
  labels.forEach((l, i) => { if (labels.length <= 12 || i % Math.ceil(labels.length / 12) === 0) g += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(l)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function grafTorta(items, { tam = 180, centro = '', sub = '', sinLeyenda = false } = {}) {
  const tot = sum(items, i => i.value) || 1; const r = 60, c = 2 * Math.PI * r; let acc = 0;
  const arcs = items.map(i => { const l = i.value / tot * c; const s = `<circle r="${r}" cx="90" cy="90" fill="none" stroke="${i.color}" stroke-width="26" stroke-dasharray="${l} ${c - l}" stroke-dashoffset="${-acc}" transform="rotate(-90 90 90)"><title>${esc(i.label)}: ${money(i.value)} (${pct(i.value, tot)}%)</title></circle>`; acc += l; return s; }).join('');
  const svg = `<svg viewBox="0 0 180 180" width="${tam}" height="${tam}" role="img" style="flex:none">${arcs}<text x="90" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#17458F">${centro}</text><text x="90" y="106" text-anchor="middle" font-size="10.5" fill="#5E6A84">${sub}</text></svg>`;
  if (sinLeyenda) return svg;
  return `<div class="row" style="gap:20px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" width="${tam}" height="${tam}" role="img">${arcs}<text x="90" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#17458F">${centro}</text><text x="90" y="106" text-anchor="middle" font-size="10.5" fill="#5E6A84">${sub}</text></svg>
  <div class="legend" style="flex-direction:column;gap:6px;flex:1;min-width:180px">${items.map(i => `<span style="justify-content:space-between;width:100%"><span style="display:inline-flex;gap:8px;align-items:center"><i class="dot" style="background:${i.color}"></i>${esc(i.label)}</span><b class="num">${money(i.value)} <span class="muted tiny">${pct(i.value, tot)}%</span></b></span>`).join('')}</div></div>`;
}
function barrasH(items, fmt = money) {
  const max = Math.max(1, ...items.map(i => i.value));
  return `<div class="bars-h">${items.map(i => `<div class="bh"><span class="ell" title="${esc(i.label)}">${i.label}</span><div class="bar"><i style="width:${pct(i.value, max)}%;background:${i.color || 'var(--azul)'}"></i></div><b class="num">${fmt(i.value)}${i.sub ? ` <span class="muted tiny">${i.sub}</span>` : ''}</b></div>`).join('')}</div>`;

const PALETA_GRAF = ['#17458F','#F7A81B','#0067C8','#D41367','#2E9E6A','#901F93','#FF7600','#00A2B8','#7A5C3E','#5E6A84','#C98507','#4E6E1F'];

/* ---------- Búsqueda global ---------- */
function buscarGlobal(q) {
  const n = norm(q).trim(); if (n.length < 2 && !/^\d+$/.test(n)) return [];
  const R = [];
  const push = (grupo, titulo, sub, h, icono) => R.push({ grupo, titulo, sub, h, icono });
  Store.list('eventos').forEach(e => { if (norm(e.nombre + ' ' + e.causa + ' ' + e.lugar).includes(n)) push('Eventos', e.nombre, `${fd(e.fecha)} · ${e.estado}`, `#/evento/${e.id}`, CATEGORIAS[e.cat].icono); });
  Store.list('socios').forEach(s => { if (norm(s.nombre + ' ' + s.tel + ' ' + s.profesion + ' ' + s.cargo).includes(n)) push('Socios', s.nombre, `${s.cargo} · ${fTel(s.tel)}`, `#/socio/${s.id}`, 'user'); });
  Store.list('colaboradores').forEach(c => { if (norm(c.nombre + ' ' + c.tel + ' ' + c.rubro + ' ' + c.contacto).includes(n)) push('Colaboradores', c.nombre, `${c.tipos.join(' · ')} · ${c.rubro}`, `#/colaboradores?ver=${c.id}`, 'edificio'); });
  Store.list('invitados').forEach(g => { if (norm(g.titular + ' ' + g.tel + ' ' + g.grupo).includes(n)) { const e = Ev(g.eventoId); push('Invitados', g.titular, `${e.nombre} · ${g.grupo} · ${personas(g)} pers.`, `#/evento/${e.id}/invitados?q=${encodeURIComponent(g.titular)}`, 'users'); } });
  const mNum = n.match(/^(?:n(?:ro|umero|°)?\s*)?(\d{1,4})$/);
  if (mNum) {
    const v = +mNum[1];
    Store.list('eventos', e => e.cat === 'rifa').forEach(e => { const x = Store.get('numeros', `${e.id}-${v}`); if (x) push('Números de rifa', `N° ${fmtN(e, v)} · ${ESTADOS_NUM[x.estado]}`, `${e.nombre}${x.comprador ? ' · ' + x.comprador : ''}`, `#/evento/${e.id}/numeros?n=${v}`, 'ticket'); });
    Store.list('lotes', l => l.n === v).forEach(l => { const e = Ev(l.eventoId); push('Lotes', `Lote ${l.n} · ${l.titulo}`, e.nombre, `#/evento/${e.id}/lotes?ver=${l.id}`, 'martillo'); });
    Store.list('postores', p => p.paleta === v).forEach(p => { const e = Ev(p.eventoId); push('Paletas', `Paleta ${p.paleta} · ${p.nombre}`, e.nombre, `#/evento/${e.id}/postores`, 'user'); });
  }
  const mL = n.match(/^lote\s*(\d+)$/); if (mL) Store.list('lotes', l => l.n === +mL[1]).forEach(l => { const e = Ev(l.eventoId); push('Lotes', `Lote ${l.n} · ${l.titulo}`, e.nombre, `#/evento/${e.id}/lotes?ver=${l.id}`, 'martillo'); });
  const mP = n.match(/^paleta\s*(\d+)$/); if (mP) Store.list('postores', p => p.paleta === +mP[1]).forEach(p => { const e = Ev(p.eventoId); push('Paletas', `Paleta ${p.paleta} · ${p.nombre}`, e.nombre, `#/evento/${e.id}/postores`, 'user'); });
  if (!mNum) Store.list('numeros', x => x.comprador && norm(x.comprador + ' ' + x.tel).includes(n)).slice(0, 6).forEach(x => { const e = Ev(x.eventoId); push('Compradores de rifa', `${x.comprador} · N° ${fmtN(e, x.n)}`, e.nombre, `#/evento/${e.id}/numeros?n=${x.n}`, 'ticket'); });
  Store.list('lotes', l => !mNum && norm(l.titulo).includes(n)).slice(0, 5).forEach(l => { const e = Ev(l.eventoId); push('Lotes', `Lote ${l.n} · ${l.titulo}`, e.nombre, `#/evento/${e.id}/lotes?ver=${l.id}`, 'martillo'); });
  return R;
}
function montarBusqueda() {
  const inp = $('#gsearch'), box = $('#gres'); let sel = -1, res = [];
  const pintar = () => {
    if (!res.length) { box.innerHTML = inp.value.trim().length >= 2 ? `<div class="search-res"><div class="empty tiny">Sin resultados para «${esc(inp.value)}»</div></div>` : ''; return; }
    const g = groupBy(res.slice(0, 40), r => r.grupo); let i = 0;
    box.innerHTML = `<div class="search-res">${Object.entries(g).map(([k, rs]) => `<h6>${k}</h6>${rs.map(r => `<button class="${i === sel ? 'f' : ''}" data-i="${i++}" data-h="${r.h}">${ic(r.icono, 'sm')}<span><b>${esc(r.titulo)}</b><small>${esc(r.sub)}</small></span></button>`).join('')}`).join('')}</div>`;
  };
  inp.addEventListener('input', debounce(() => { res = buscarGlobal(inp.value); sel = -1; pintar(); }, 120));
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, Math.min(res.length, 40) - 1); pintar(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); pintar(); e.preventDefault(); }
    if (e.key === 'Enter' && res.length) { const r = res[Math.max(sel, 0)]; inp.value = ''; box.innerHTML = ''; go(r.h); }
    if (e.key === 'Escape') { inp.value = ''; box.innerHTML = ''; inp.blur(); }
  });
  box.addEventListener('mousedown', e => { const b = e.target.closest('button[data-h]'); if (b) { e.preventDefault(); inp.value = ''; box.innerHTML = ''; go(b.dataset.h); } });
  inp.addEventListener('blur', () => setTimeout(() => box.innerHTML = '', 150));
}

/* ---------------- MESAS: plano del salón ---------------- */
function geomMesa(m) {
  const N = Math.max(1, +m.cap || 1);
  if (m.forma === 'rectangular') {
    const ends = N >= 6 ? 2 : 0, top = Math.ceil((N - ends) / 2), bot = N - ends - top, bw = Math.max(top, 1) * 26 + 18, bh = 46;
    const W = bw + (ends ? 44 : 14), H = bh + 44, x0 = (W - bw) / 2, y0 = 22;
    const seats = [];
    for (let i = 0; i < top; i++) seats.push([x0 + 9 + 13 + i * 26, y0 - 10]);
    for (let i = 0; i < bot; i++) seats.push([x0 + 9 + 13 + i * 26, y0 + bh + 10]);
    if (ends) { seats.push([x0 - 12, y0 + bh / 2]); seats.push([x0 + bw + 12, y0 + bh / 2]); }
    return { W, H, cx: W / 2, cy: y0 + bh / 2, tabla: `<rect class="tbl" x="${x0}" y="${y0}" width="${bw}" height="${bh}" rx="8"`, seats };
  }
  const R = 30 + Math.max(0, N - 8) * 2, D = R + 13, W = 2 * (D + 10);
  const seats = [...Array(N)].map((_, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [W / 2 + D * Math.cos(a), W / 2 + D * Math.sin(a)]; });
  return { W, H: W, cx: W / 2, cy: W / 2, tabla: `<circle class="tbl" cx="${W / 2}" cy="${W / 2}" r="${R}"`, seats };
}
function svgMesa(m, ev, occ) {
  const g = geomMesa(m), n = occ.n, exc = n > m.cap, full = n === m.cap;
  const cols = []; occ.gs.forEach(gr => { const c = colorGrupo(ev, gr.grupo); for (let i = 0; i < personas(gr); i++) cols.push(c); });
  const seats = g.seats.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="7.5" fill="${cols[i] || '#fff'}" stroke="${cols[i] ? 'rgba(0,0,0,.15)' : '#B8C2D3'}" stroke-width="1.5"/>`).join('');
  const colTxt = exc ? '#D64545' : full ? '#2E9E6A' : '#17458F';
  return `<svg width="${g.W}" height="${g.H}" viewBox="0 0 ${g.W} ${g.H}">${seats}${g.tabla} fill="${exc ? '#FBE9E9' : '#FFFFFF'}" stroke="${exc ? '#D64545' : '#17458F'}" stroke-width="2"/>
    <text x="${g.cx}" y="${g.cy + 5}" text-anchor="middle" font-family="Open Sans,Arial" font-size="15" font-weight="800" fill="${colTxt}">${n}/${m.cap}</text></svg>`;
}

function montarPlano(ev) {
  const plano = $('#plano'), scroll = $('#pscroll'); if (!plano) return;
  const st = UI.f.mesas;
  if (!st.zoomInit) { st.zoomInit = true; const z = clamp((scroll.clientWidth - 8) / PLANO_W, .32, 1); if (Math.abs(z - (st.zoom || .7)) > .01) { st.zoom = Math.round(z * 100) / 100; render(); return; } }
  if (st.scroll) { scroll.scrollLeft = st.scroll[0]; scroll.scrollTop = st.scroll[1]; }
  scroll.addEventListener('scroll', () => st.scroll = [scroll.scrollLeft, scroll.scrollTop], { passive: true });
  const z = st.zoom || .7;
  let drag = null, clickTimer = null;
  plano.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-quitar]')) return;
    const el = e.target.closest('.mesa,.elem'); if (!el || e.button > 0) return;
    drag = { el, x0: e.clientX, y0: e.clientY, l0: parseFloat(el.style.left), t0: parseFloat(el.style.top), mov: false, id: e.pointerId };
  });
  plano.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = (e.clientX - drag.x0) / z, dy = (e.clientY - drag.y0) / z;
    if (!drag.mov && Math.hypot(dx, dy) * z < 5) return;
    if (!drag.mov) { drag.mov = true; drag.el.classList.add('dragging'); try { drag.el.setPointerCapture(e.pointerId); } catch (er) {} }
    drag.el.style.left = clamp(drag.l0 + dx, 0, PLANO_W - 60) + 'px'; drag.el.style.top = clamp(drag.t0 + dy, 0, PLANO_H - 40) + 'px';
    e.preventDefault();
  });

      d.el.classList.remove('dragging');
      const x = Math.round(parseFloat(d.el.style.left) / 10) * 10, y = Math.round(parseFloat(d.el.style.top) / 10) * 10;
      d.el.style.left = x + 'px'; d.el.style.top = y + 'px';
      if (d.el.dataset.mesa) Store.update('mesas', d.el.dataset.mesa, { x, y }, { silent: true }); else Store.update('elementos', d.el.dataset.el, { x, y }, { silent: true });

}

/* Asignación automática de los grupos sin mesa: mantiene cada grupo junto, prioriza mesas donde ya
   hay gente del mismo grupo y llena primero las mesas con menos lugar libre. Si no alcanza, puede crear mesas nuevas. */
function propuestaAsignacion(ev, grupos, crearMesas) {
  const mesas = Store.list('mesas', m => m.eventoId === ev.id);
  const libre = new Map(), grs = new Map();
  mesas.forEach(m => { const o = ocupacionMesa(m); libre.set(m.id, m.cap - o.n); grs.set(m.id, new Set(o.gs.map(x => x.grupo))); });
  let num = Math.max(0, ...mesas.map(m => +(m.nombre.match(/^Mesa (\d+)$/) || [0, 0])[1]));
  const plan = [], sinLugar = [], nuevas = [];
  grupos.slice().sort((a, b) => personas(b) - personas(a)).forEach(g => {
    const p = personas(g), todas = [...mesas, ...nuevas];
    const entra = todas.filter(m => libre.get(m.id) >= p).sort((a, b) => libre.get(a.id) - libre.get(b.id));
    const m = entra.find(m => grs.get(m.id).has(g.grupo)) || entra[0];
    if (m) { plan.push({ g, m }); libre.set(m.id, libre.get(m.id) - p); grs.get(m.id).add(g.grupo); }
    else if (crearMesas) { const nm = { id: 'nueva' + nuevas.length, nombre: 'Mesa ' + (++num), cap: Math.max(10, p), forma: 'redonda', nueva: true }; nuevas.push(nm); libre.set(nm.id, nm.cap - p); grs.set(nm.id, new Set([g.grupo])); plan.push({ g, m: nm }); }
    else sinLugar.push(g);

    ...Store.list('elementos', e => e.eventoId === ev.id).map(e => [e.x, e.y, e.w, e.h]), ...ocupados];
  const choca = (x, y) => rects.some(([a, b, w, h]) => x < a + w + 10 && x + 130 > a - 10 && y < b + h + 10 && y + 190 > b - 10);
  for (let y = 110; y <= PLANO_H - 190; y += 50) for (let x = 30; x <= PLANO_W - 130; x += 40) if (!choca(x, y)) return [x, y];
  return [30 + ocupados.length * 20, PLANO_H - 200];

/* Plano como SVG (para imprimir y PDF): se recorta al contenido para que entre en UNA hoja A4
   y debajo de cada mesa se listan los grupos sentados. Devuelve { svg, w, h }. */
function planoSVG(ev) {
  const ms = Store.list('mesas', m => m.eventoId === ev.id), es = Store.list('elementos', e => e.eventoId === ev.id);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const caja = (a, b, c, d) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d); };
  const els = es.map(e => { const T = ELEMENTOS_PLANO[e.tipo] || ELEMENTOS_PLANO.otro; caja(e.x, e.y, e.x + e.w, e.y + e.h);
    return `<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="10" fill="${T.c}15" stroke="${T.c}" stroke-width="2" stroke-dasharray="6 4"/><text x="${e.x + e.w / 2}" y="${e.y + e.h / 2 + 5}" text-anchor="middle" font-size="15" font-weight="700" fill="${T.c}">${esc(e.nombre)}</text>`; }).join('');
  const mts = ms.map(m => {
    const o = ocupacionMesa(m), g = geomMesa(m), inner = svgMesa(m, ev, o).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
    const nombres = o.gs.slice(0, 4).map(gr => { const t = gr.titular.length > 24 ? gr.titular.slice(0, 23) + '…' : gr.titular; return { t: `${t} (${personas(gr)})`, c: colorGrupo(ev, gr.grupo) }; });
    if (o.gs.length > 4) nombres.push({ t: `+ ${o.gs.length - 4} grupos más`, c: '#5E6A84' });
    caja(m.x - 22, m.y, m.x + g.W + 22, m.y + g.H + 24 + nombres.length * 13);
    return `<g transform="translate(${m.x},${m.y})">${inner}<text x="${g.W / 2}" y="${g.H + 16}" text-anchor="middle" font-size="14" font-weight="700" fill="#17458F">${esc(m.nombre)}</text>
      ${nombres.map((n, i) => `<text x="${g.W / 2}" y="${g.H + 30 + i * 13}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${n.c}">${esc(n.t)}</text>`).join('')}</g>`; }).join('');
  if (!isFinite(x0)) { x0 = 0; y0 = 0; x1 = PLANO_W; y1 = PLANO_H; }
  const p = 14; x0 -= p; y0 -= p; x1 += p; y1 += p;
  const w = Math.round(x1 - x0), h = Math.round(y1 - y0);
  return { w, h, svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${Math.round(x0)} ${Math.round(y0)} ${w} ${h}" font-family="Open Sans,Arial"><rect x="${Math.round(x0)}" y="${Math.round(y0)}" width="${w}" height="${h}" fill="#fff"/>${els}${mts}</svg>` };
}

function montarOrden(cont, item, alSoltar) {
  const box = $(cont); if (!box) return; let src = null;
  $$(item, box).forEach(el => {
    el.addEventListener('dragstart', e => { src = el; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', el.dataset.id); } catch (er) {} el.style.opacity = .5; });
    el.addEventListener('dragend', () => { el.style.opacity = ''; $$(item, box).forEach(x => x.classList.remove('over')); });
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', () => el.classList.remove('over'));
    el.addEventListener('drop', e => { e.preventDefault(); if (!src || src === el) return; const r = el.getBoundingClientRect(); const despues = (e.clientY - r.top) > r.height / 2 || (e.clientX - r.left) > r.width * .6 && r.height > 200;

  });
}

/* =====================================================================

const COL_NUM = { libre: '#FFFFFF', asignado: '#DCE7F7', pago: '#2E9E6A', pendiente: '#E0A100', anulado: '#F3D4D4' };

/* ---------------- RECAUDACIÓN ---------------- */
TabFn['rifa.recaudacion'] = ev => {

  const semanas = Object.keys(porSemana).sort();
  return `<div class="grid g4 mb">${kpi('Total recaudado', money(s.recaudado), `${s.pago} números pagos`, 'ok', 'billete')}${kpi('Pendiente de cobro', money(s.porCobrar), `${s.pendiente} números`, s.pendiente ? 'warn' : '')}
    ${kpi('Vendido', s.pctVendido + '%', `${s.vendidos} de ${s.total} números`, '', 'ticket')}${kpi(d >= 0 ? 'Días al sorteo' : 'Sorteada', d >= 0 ? d : '✓', fdl(ev.fecha), '', 'calendario')}</div>

      <dl class="kv mt"><dt>Meta</dt><dd>${money(ev.meta)}</dd><dt>Proyección si se vende todo</dt><dd>${money(s.proyeccion + f.otros.total)}</dd><dt>Gastos</dt><dd>${money(f.gTotal)}</dd><dt>Resultado neto hoy</dt><dd class="ok">${money(f.resultado)}</dd><dt>Dinero sin rendir</dt><dd class="warn">${money(sum(vs, v => Math.max(0, v.saldo)))}</dd></dl></div>
    <div class="card pad"><h3 class="mb" style="font-size:16px">${ic('grilla')} Estado de los números</h3>${grafTorta([{ label: 'Vendido pago', value: s.pago, color: '#2E9E6A' }, { label: 'Vendido pendiente', value: s.pendiente, color: '#E0A100' }, { label: 'Asignado sin vender', value: s.asignado, color: '#9DB8E2' }, { label: 'Libre', value: s.libre, color: '#E3E8F0' }, { label: 'Anulado', value: s.anulado, color: '#D64545' }].filter(x => x.value), { tam: 160, centro: s.pctVendido + '%', sub: 'vendido' }).replace(/\$ /g, '')}</div>
  </div>

  </div>`;
};

  return `<div class="alert warn mb">${ic('alerta')}<div><b>Las rifas pueden requerir autorización previa – verificar con la autoridad competente.</b> Guardá el número de expediente o resolución en esta ficha.</div></div>
  <div class="card pad" style="max-width:860px"><form class="form" id="rifacfg">${campos.map(f => campoHTML(f, vals[f.k])).join('')}</form>
    <div class="row mt" style="justify-content:flex-end"><button class="btn btn-b" data-a="guardarRifaCfg" data-ev="${ev.id}" ${lock ? 'disabled' : ''}>${ic('check', 'sm')} Guardar configuración</button></div></div>
  ${lock ? `<div class="alert info mt">${ic('candado')}<div>La rifa ya fue sorteada: la configuración queda en solo lectura.</div></div>` : ''}`;
};
Acc.guardarRifaCfg = el => {
  const ev = Ev(el.dataset.ev), f = $('#rifacfg');
  const g = k => f.querySelector(`[name="${k}"]`);
  const nuevo = { nombre: g('nombre').value.trim() || ev.nombre, fecha: g('fecha').value, hora: g('hora').value, lugar: g('lugar').value.trim() };
  const cfg = { ...ev.cfg, precio: +g('precio').value || ev.cfg.precio, porTalonario: +g('porTalonario').value || 100, forma: g('forma').value, fechaQuiniela: g('fechaQuiniela').value, autorizacion: g('autorizacion').value.trim(), testigos: g('testigos').value.trim(), repetir: g('repetir').checked };
  const cant = +g('cantidad').value || ev.cfg.cantidad;
  const hayVentas = statsRifa(ev).vendidos > 0 || Store.list('talonarios', t => t.eventoId === ev.id).length;
  Store.bulk(() => {
    if (cant !== ev.cfg.cantidad) {
      if (hayVentas) toast('La cantidad de números no se cambió porque ya hay talonarios o ventas', 'bad');
      else { Store.removeWhere('numeros', n => n.eventoId === ev.id, { silent: true }); for (let n = 0; n < cant; n++) Store.create('numeros', { id: `${ev.id}-${n}`, eventoId: ev.id, n, estado: 'libre', vendedorId: null, comprador: '', tel: '', ci: '', fecha: null }, { silent: true, sinAutor: true }); cfg.cantidad = cant; }
    }
    Store.update('eventos', ev.id, { ...nuevo, cfg }, { silent: true });
  });
  toast('Configuración guardada');
};

function pintarEscena() {
  const st = $('#stage'); if (!st || !SORTEO) return;
  const ev = Ev(SORTEO.evId), ps = Store.list('premios', p => p.eventoId === ev.id).sort((a, b) => a.orden - b.orden), pend = premiosPendientes(ev), cur = pend[0];
  const dig = String(ev.cfg.cantidad - 1).length, U = SORTEO.ultimo;
  const manual = ev.cfg.forma !== 'interno';
  st.innerHTML = `<div class="rueda-fondo" aria-hidden="true">${LOGO_CLUB.ruedaFondoOscuro}</div><div class="confetti" id="confetti"></div>
  <div class="stage-top"><span class="lg">${LOGO_CLUB.horizontal}</span><h2>${esc(ev.nombre)}</h2><button class="btn btn-sm" data-a="salirEscena">${ic('x', 'sm')} Salir</button></div>
  <div class="stage-b">
    ${U && !SORTEO.girando ? `<div class="premio-lbl">${ordinal(U.p.orden)} premio</div><div class="premio">${esc(U.p.desc)}</div>`
      : cur ? `<div class="premio-lbl">Se sortea el ${ordinal(cur.orden)} premio</div><div class="premio">${esc(cur.desc)}</div>` : `<div class="premio-lbl">Sorteo finalizado</div><div class="premio">¡Gracias por colaborar!</div>`}
    <div class="reels" id="reels">${[...Array(dig)].map((_, i) => `<div class="reel"><span>${U ? String(U.n).padStart(dig, '0')[i] : '•'}</span></div>`).join('')}</div>
    <div class="winner" id="winner">${U && !SORTEO.girando ? `<div class="nm">${esc(U.nombre)}</div><div class="sb">Número ${fmtN(ev, U.n)} · vendido por ${esc(nomSoc(U.vendedorId))}</div>` : `<div class="sb">${pend.length ? `Participan ${elegibles(ev).length} números vendidos y pagos` : ''}</div>`}</div>
    ${manual && cur && !U ? `<div class="row" style="justify-content:center"><input id="numManual" class="inp" style="width:180px;height:56px;font-size:26px;text-align:center" inputmode="numeric" placeholder="N° salido"><button class="btn btn-p btn-lg" data-a="buscarDueno">Buscar dueño</button></div><div class="small" style="opacity:.75">Ingresá el número que salió en la ${ev.cfg.forma === 'quiniela' ? 'Quiniela' : 'Lotería'} del ${fd(ev.cfg.fechaQuiniela)}</div>` : ''}
    <div id="msgSorteo" class="small" style="min-height:20px;color:#FFD9A8"></div>
  </div>
  <div class="stage-f">
    ${U && !SORTEO.girando && U.tel ? waBtn(U.tel, txtWA('ganador', { nombre: U.nombre.split(' ')[0], numero: fmtN(ev, U.n), orden: ordinalTxt(U.p.orden), evento: ev.nombre, premio: U.p.desc }), 'Avisar al ganador por WhatsApp', 'btn-lg') : ''}
    ${!SORTEO.girando && cur && !manual ? `<button class="btn btn-p btn-lg" data-a="sortear">${ic('mezclar')} Sortear ${ordinal(cur.orden)} premio</button>` : ''}
    ${!SORTEO.girando && U && cur && manual ? `<button class="btn btn-p btn-lg" data-a="siguienteManual">Siguiente premio</button>` : ''}
    ${!cur && !SORTEO.girando ? `<button class="btn btn-p btn-lg" data-a="finalizarSorteo">${ic('check')} Finalizar y ver el acta</button>` : ''}
  </div>
  <div class="stage-f" style="padding-top:0"><div class="stage-list">${ps.map(p => `<span class="pz ${p.ganadorN != null ? 'done' : ''} ${cur && p.id === cur.id ? 'cur' : ''}">${ordinal(p.orden)} ${esc(p.desc.length > 30 ? p.desc.slice(0, 29) + '…' : p.desc)}${p.ganadorN != null ? ` → ${fmtN(ev, p.ganadorN)}` : ''}</span>`).join('')}</div></div>`;
}
function elegibles(ev) {
  const ganadores = Store.list('premios', p => p.eventoId === ev.id && p.ganadorN != null);
  const nums = new Set(ganadores.map(p => p.ganadorN)), personasG = new Set(ganadores.map(p => norm(p.ganador) + '|' + (p.ganadorTel || '')));
  return numerosDe(ev.id).filter(n => n.estado === 'pago' && !nums.has(n.n) && (ev.cfg.repetir || !personasG.has(norm(n.comprador) + '|' + (n.tel || ''))));
}
function guardarGanador(ev, p, x) {
  Store.update('premios', p.id, { ganadorN: x.n, ganador: x.comprador, ganadorTel: x.tel, sorteadoEl: new Date().toISOString().slice(0, 19) }, { noRender: true });
  Store.registrar('Premio sorteado', `${ordinal(p.orden)} premio (${p.desc}): N° ${fmtN(ev, x.n)} – ${x.comprador}`, ev.id);
  SORTEO.ultimo = { p, n: x.n, nombre: x.comprador, tel: x.tel, vendedorId: x.vendedorId };
}
Acc.sortear = () => {
  const ev = Ev(SORTEO.evId), p = premiosPendientes(ev)[0], pool = elegibles(ev);
  if (!pool.length) { $('#msgSorteo').textContent = 'No quedan números habilitados para sortear.'; return; }
  const arr = new Uint32Array(1); (window.crypto || window.msCrypto).getRandomValues(arr);
  const x = pool[arr[0] % pool.length];                       // azar criptográfico, transparente
  SORTEO.ultimo = null; SORTEO.girando = true; pintarEscena();
  const dig = String(ev.cfg.cantidad - 1).length, fin = String(x.n).padStart(dig, '0');
  const reels = $$('#reels .reel');
  if (reduceMotion()) { SORTEO.girando = false; guardarGanador(ev, p, x); pintarEscena(); confeti(); return; }
  reels.forEach(r => r.classList.add('spin'));
  const t0 = performance.now(), paradas = reels.map((_, i) => 1700 + i * 650);
  const tick = () => {
    const t = performance.now() - t0;
    reels.forEach((r, i) => { if (t < paradas[i]) r.firstChild.textContent = Math.floor(Math.random() * 10); else if (r.classList.contains('spin')) { r.classList.remove('spin'); r.firstChild.textContent = fin[i]; r.classList.add('stop'); } });
    if (t < paradas[paradas.length - 1] + 50) setTimeout(tick, 55); else setTimeout(() => { SORTEO.girando = false; guardarGanador(ev, p, x); pintarEscena(); confeti(); }, 450);
  };
  tick();
};
Acc.buscarDueno = () => {
  const ev = Ev(SORTEO.evId), p = premiosPendientes(ev)[0], v = parseInt(($('#numManual') || {}).value, 10), msg = $('#msgSorteo');
  if (isNaN(v)) { msg.textContent = 'Ingresá el número que salió.'; return; }
  const n = v % ev.cfg.cantidad, x = Store.get('numeros', `${ev.id}-${n}`);
  if (!x || x.estado !== 'pago') { msg.innerHTML = `El número <b>${fmtN(ev, n)}</b> ${x && x.estado === 'pendiente' ? 'está vendido pero <b>no pago</b>' : 'no fue vendido'}: no tiene dueño habilitado. Según el reglamento, ingresá el siguiente número de la ${ev.cfg.forma === 'quiniela' ? 'Quiniela' : 'Lotería'}.`; return; }
  if (!elegibles(ev).some(e => e.n === n)) { msg.textContent = 'Ese comprador ya ganó un premio (regla: no repite). Ingresá el siguiente número.'; return; }
  guardarGanador(ev, p, x); pintarEscena(); confeti();
};
Acc.siguienteManual = () => { SORTEO.ultimo = null; pintarEscena(); };
Acc.finalizarSorteo = () => {
  const ev = Ev(SORTEO.evId);
  Store.update('eventos', ev.id, { estado: 'Realizado', cfg: { ...ev.cfg, sorteada: new Date().toISOString().slice(0, 19) } }, { noRender: true });
  Store.registrar('Rifa sorteada', `${ev.nombre}: todos los premios sorteados. Rifa bloqueada (solo lectura).`, ev.id);
  Acc.salirEscena(); go(`#/evento/${ev.id}/sorteo`); toast('Sorteo finalizado. El acta está lista para imprimir.');
};
Acc.salirEscena = () => { const st = $('#stage'); if (st) st.remove(); try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} SORTEO = null; render(); };
function confeti() {
  if (reduceMotion()) return;
  const c = $('#confetti'); if (!c) return;
  const cols = ['#F7A81B', '#FFFFFF', '#0067C8', '#FFD27A'];
  c.innerHTML = [...Array(70)].map(() => `<i style="left:${Math.random() * 100}%;background:${pick(cols)};animation-duration:${2.4 + Math.random() * 2.2}s;animation-delay:${Math.random() * .6}s;transform:rotate(${Math.random() * 360}deg)"></i>`).join('');
  setTimeout(() => { if (c) c.innerHTML = ''; }, 5200);
}

   11) REMATES SOLIDARIOS: Resumen · Lotes · Catálogo · Postores ·

const fotoLote = (l, grande = false) => fotoPlaceholder(ICONO_LOTE[l.cat] || 'regalo', COLOR_LOTE[l.cat] || '#5E6A84', 'Lote ' + l.n, grande);
const CHIP_LOTE = { 'Recibido': 'gray', 'En catálogo': 'azure', 'Rematado': 'blue', 'Sin oferta': 'warn', 'Entregado': 'ok', 'Devuelto al donante': 'gray' };

/* ---------------- RESUMEN ---------------- */
TabFn['remate.resumen'] = ev => {

  const realizado = s.adj.length > 0;
  return `<div class="grid g4 mb">${kpi('Lotes', s.total, ESTADOS_LOTE.filter(e => s.porEstado[e]).map(e => `${(s.porEstado[e] || []).length} ${e.toLowerCase()}`).join(' · '), '', 'caja')}
    ${kpi('Valor estimado total', money(s.valorEstimado), `base total ${money(s.baseTotal)}`, '', 'etiqueta')}
    ${kpi(realizado ? 'Rematado' : 'Postores registrados', realizado ? money(s.rematado) : pst, realizado ? `${pct(s.rematado, s.valorAdj)}% del valor estimado de lo vendido` : 'con paleta asignada', realizado ? 'ok' : '', realizado ? 'martillo' : 'users')}
    ${kpi('Cobrado', money(s.cobrado), s.porCobrar ? `falta cobrar ${money(s.porCobrar)}` : 'todo cobrado', s.vencidos.length ? 'bad' : s.porCobrar ? 'warn' : 'ok', 'billete')}</div>
  <div class="grid g2">
    <div class="card pad"><h3 class="mb" style="font-size:16px">${ic('meta')} Recaudado vs. valor estimado</h3>
      <div class="prog-l"><span>Rematado</span><b>${money(s.rematado)} / ${money(s.valorEstimado)}</b></div>${prog(s.rematado, s.valorEstimado, 'gold', true)}
      <div class="prog-l mt"><span>Recaudado vs. meta (${money(ev.meta)})</span><b>${f.pctMeta}%</b></div>${prog(f.recaudado, ev.meta, 'ok', true)}
      <dl class="kv mt"><dt>Lotes restantes</dt><dd>${s.restantes.length}</dd><dt>Sin entregar</dt><dd class="${s.sinEntregar.length ? 'warn' : ''}">${s.sinEntregar.length}</dd><dt>Cobros pendientes</dt><dd class="${s.vencidos.length ? 'bad' : ''}">${s.pendientes.length}${s.vencidos.length ? ` (${s.vencidos.length} vencido)` : ''}</dd><dt>Resultado neto</dt><dd class="${f.resultado >= 0 ? 'ok' : 'bad'}">${money(f.resultado)}</dd></dl>
      ${!bloqueado(ev) && s.restantes.length ? `<div class="mt"><a class="btn btn-p" href="#/evento/${ev.id}/vivo">${ic('martillo')} Iniciar remate en vivo</a></div>` : ''}</div>
    <div class="card pad"><h3 class="mb" style="font-size:16px">${ic('grafico')} Valor estimado por categoría</h3>${barrasH(porCat.map(x => ({ ...x, label: esc(x.label) })))}</div>
  </div>`;
};

/* ---------------- LOTES ---------------- */
TabFn['remate.lotes'] = ev => {
  const lock = bloqueado(ev), est = F('lo', 'est', 'Todos'), cat = F('lo', 'cat', ''), q = norm(F('lo', 'q', '')), vista = F('lo', 'vista', 'tarj');
  let ls = lotesDe(ev.id);
  const all = ls;
  if (est !== 'Todos') ls = ls.filter(l => l.estado === est); if (cat) ls = ls.filter(l => l.cat === cat);
  if (q) ls = ls.filter(l => norm(l.titulo + ' ' + l.desc + ' ' + nomCol(l.donanteId) + ' ' + l.n).includes(q));
  if (UI.q.ver) { const id = UI.q.ver; delete UI.q.ver; after(() => Acc.editarLote({ dataset: { id } })); }
  const ordenable = !lock && est === 'Todos' && !cat && !q;
  if (ordenable && vista === 'tarj') after(() => montarOrden('#lotesg', '.lote', ids => reordenarLotes(ev, ids)));
  const cuenta = e => all.filter(l => l.estado === e).length;
  const pst = new Map(Store.list('postores', p => p.eventoId === ev.id).map(p => [p.id, p]));
  return `<div class="toolbar">${seg('lo', 'vista', [['tarj', 'Tarjetas'], ['lista', 'Lista']], vista)}${buscador('lo', 'Buscar lote, donante o N°…')}
    <select class="sel" data-ch="setFv" data-k="lo.cat"><option value="">Todas las categorías</option>${CATEGORIAS_LOTE.map(c => `<option ${c === cat ? 'selected' : ''}>${c}</option>`).join('')}</select><span style="flex:1"></span>

  <div class="toolbar">${fchips('lo', 'est', [['Todos', 'Todos', all.length], ...ESTADOS_LOTE.map(e => [e, e, cuenta(e)])], est)}</div>
  ${ordenable && vista === 'tarj' ? `<p class="small muted">${ic('grip', 'sm')} Arrastrá las tarjetas para definir el orden de salida (el N° de lote se actualiza solo).</p>` : ''}
  ${vista === 'tarj' ? `<div class="lotes-g" id="lotesg">${ls.map(l => `<div class="card lote" draggable="${ordenable}" data-id="${l.id}">${fotoLote(l)}
      <div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><h4>${esc(l.titulo)}</h4>${ordenable ? `<span class="drag">${ic('grip', 'sm')}</span>` : ''}</div>
      <div class="small muted">${esc(l.cat)} · donado por <b>${esc(nomCol(l.donanteId))}</b></div>
      <div class="row between small"><span>Valor <b>${money(l.valor)}</b></span><span>Base <b>${money(l.base)}</b></span></div>
      <div class="row between">${chip(l.estado, CHIP_LOTE[l.estado])}${l.silenciosa ? chip('Silenciosa', 'violet') : ''}${adjudicado(l) ? `<b class="ok">${money(l.final)}</b>` : ''}</div>
      ${adjudicado(l) ? `<div class="small">Paleta ${(pst.get(l.postorId) || {}).paleta} · ${esc((pst.get(l.postorId) || {}).nombre || '')}</div>` : ''}
      <button class="btn btn-xs" style="margin-top:auto" data-a="editarLote" data-id="${l.id}">${ic('editar', 'sm')} ${lock ? 'Ver' : 'Editar'}</button></div>`).join('') || `<div class="card">${vacio('No hay lotes con ese filtro.')}</div>`}</div>`
  : `<div class="card">${tabla([{ h: 'N°' }, { h: 'Lote' }, { h: 'Categoría' }, { h: 'Donante' }, { h: 'Valor est.', num: 1 }, { h: 'Base', num: 1 }, { h: 'Estado' }, { h: 'Precio final', num: 1 }, { h: 'Comprador' }],
      ls.map(l => `<tr class="clic" data-a="editarLote" data-id="${l.id}"><td><span class="pill-n">${l.n}</span></td><td><b>${esc(l.titulo)}</b></td><td>${esc(l.cat)}</td><td>${esc(nomCol(l.donanteId))}</td><td class="num">${money(l.valor)}</td><td class="num">${money(l.base)}</td><td>${chip(l.estado, CHIP_LOTE[l.estado])}</td><td class="num">${l.final ? money(l.final) : '—'}</td><td>${l.postorId ? `Paleta ${(pst.get(l.postorId) || {}).paleta}` : ''}</td></tr>`),
      { foot: `<tr><td colspan="4">${ls.length} lotes</td><td class="num">${money(sum(ls, l => l.valor))}</td><td class="num">${money(sum(ls, l => l.base))}</td><td></td><td class="num">${money(sum(ls, l => l.final))}</td><td></td></tr>` })}</div>`}`;
};
function reordenarLotes(ev, ids) {
  const renumerar = !lotesDe(ev.id).some(adjudicado);
  Store.bulk(() => ids.forEach((id, i) => Store.update('lotes', id, renumerar ? { orden: i, n: i + 1 } : { orden: i }, { silent: true })));
  toast(renumerar ? 'Orden de salida actualizado' : 'Orden actualizado');

function camposLote(ev) {
  const pst = Store.list('postores', p => p.eventoId === ev.id).sort((a, b) => a.paleta - b.paleta);

    { k: 'valor', l: 'Valor estimado', t: 'money', half: true }, { k: 'base', l: 'Precio base', t: 'money', half: true }, { k: 'estado', l: 'Estado', t: 'select', op: ESTADOS_LOTE, half: true },

Acc.vivoFull = el => { const V = V_(Ev(el.dataset.ev)); V.full = !V.full; render(); };

Acc.pujar = el => { const ev = Ev(el.dataset.ev), V = V_(ev), l = Store.get('lotes', V.loteId); const actual = V.pujas.length ? V.pujas[V.pujas.length - 1].monto : null; pujar(ev, actual == null ? l.base : actual + +el.dataset.m); };

Acc.deshacerPuja = el => { const V = V_(Ev(el.dataset.ev)); V.pujas.pop(); render(); };
Acc.adjudicar = async el => {

Acc.sinOferta = el => { const ev = Ev(el.dataset.ev), V = V_(ev), l = Store.get('lotes', V.loteId); Store.update('lotes', l.id, { estado: 'Sin oferta' }); V.loteId = null; V.pujas = []; V.paleta = null; render(); toast(`Lote ${l.n} sin oferta`); };
Acc.cerrarRemate = async el => {

/* ---------------- ADJUDICACIONES Y COBROS ---------------- */

      <div class="row">${chip(c.estado)}${c.saldo > 0 ? waBtn(c.postor.tel, txtWA('cobroRemate', { nombre: c.postor.nombre.split(' ')[0], evento: ev.nombre, monto: money(c.saldo), lotes: c.lotes.map(l => 'lote ' + l.n + ' (' + l.titulo + ')').join(', ') })) : ''}

    ${tabla([{ h: 'Lote' }, { h: 'Precio', num: 1 }, { h: 'Cobro' }, { h: 'Medio' }, { h: 'Entrega' }, { h: '' }], c.lotes.map(l => `<tr><td><b>Lote ${l.n}</b> · ${esc(l.titulo)}${l.nota ? `<div class="sub">${esc(l.nota)}</div>` : ''}</td><td class="num">${money(totalLote(l, ev))}</td>

}

function filtroLedger(vista, tipo) {

/* ---------- FLUJO DE CAJA ---------- */
const UMBRAL_AJUSTADO = 30000;
function finCaja() {
  const per = perSel('fc', 'todo'), fc = flujoCaja();
  const ms = fc.meses.filter(m => enRango(m.mes + '-15', per.desde, per.hasta));
  const neg = fc.meses.filter(m => m.fin < 0), ajust = fc.meses.filter(m => m.fin >= 0 && m.fin < UMBRAL_AJUSTADO);
  const ult = fc.meses[fc.meses.length - 1];
  return `<div class="alert info mb">${ic('info')}<div><b>Solo lo real.</b> Cada mes: saldo inicial + lo efectivamente cobrado – lo efectivamente pagado = saldo final, que pasa al mes siguiente. Lo pendiente no entra hasta que se marca como cobrado o pagado.</div></div>
  ${neg.length ? `<div class="alert bad mb">${ic('alerta')}<div><b>Atención:</b> la caja cerró en negativo en ${neg.map(m => mesLargo(m.mes)).join(', ')}.</div></div>` : ''}
  ${ajust.length ? `<div class="alert warn mb">${ic('alerta')}<div>Mes ajustado: ${ajust.map(m => `<b>${mesLargo(m.mes)}</b> (${money(m.fin)})`).join(', ')}. Conviene prever los pagos grandes con anticipación.</div></div>` : ''}
  <div class="grid g4 mb">${kpi('Saldo de caja actual', money(fc.saldo), `al ${fd(HOY_ISO)}`, fc.saldo < 0 ? 'bad' : 'ok', 'billetera')}${kpi('Efectivo', money(fc.ef), 'en poder del tesorero', '', 'billete')}${kpi('Banco', money(fc.bco), esc(Store.club().banco), '', 'banco')}${kpi(`Movimiento de ${mesLargo(ult.mes)}`, (ult.neto >= 0 ? '+' : '') + money(ult.neto), `cobros ${money(ult.cobros)} · pagos ${money(ult.pagos)}`, ult.neto >= 0 ? 'ok' : 'warn')}</div>
  <div class="card"><div class="card-h"><h3>${ic('sube')} Evolución del saldo</h3><span class="legend small"><span><i class="dot" style="background:#E0A100"></i> Mes ajustado</span><span><i class="dot" style="background:#D64545"></i> Negativo</span></span></div><div class="card-b">${grafLinea({ labels: fc.meses.map(m => mesNombre(m.mes)), values: fc.meses.map(m => m.fin), umbral: UMBRAL_AJUSTADO })}</div></div>
  <div class="toolbar mt">${selPeriodo('fc', 'todo')}<span class="muted small">Tocá un mes para ver sus movimientos.</span><span style="flex:1"></span><button class="btn btn-sm" data-a="docXLSX" data-doc="caja" data-per="${per.id}">${ic('excel', 'sm')} Excel</button><button class="btn btn-sm" data-a="docPDF" data-doc="caja" data-per="${per.id}">${ic('pdf', 'sm')} PDF</button></div>
  <div class="card">${tabla([{ h: 'Mes' }, { h: 'Saldo inicial', num: 1 }, { h: 'Cobros efectivo', num: 1 }, { h: 'Cobros banco', num: 1 }, { h: 'Pagos efectivo', num: 1 }, { h: 'Pagos banco', num: 1 }, { h: 'Saldo efectivo', num: 1 }, { h: 'Saldo banco', num: 1 }, { h: 'Saldo final', num: 1 }],
    ms.slice().reverse().map(m => `<tr class="clic" data-a="verMesCaja" data-m="${m.mes}"><td><b>${mesLargo(m.mes)}</b>${m.fin < 0 ? ' ' + chip('Negativo', 'bad') : m.fin < UMBRAL_AJUSTADO ? ' ' + chip('Ajustado', 'warn') : ''}</td><td class="num">${money(m.ini)}</td>
      <td class="num ok">${m.cobEf ? '+' + money(m.cobEf) : '—'}</td><td class="num ok">${m.cobBco ? '+' + money(m.cobBco) : '—'}</td><td class="num bad">${m.pagEf ? '−' + money(m.pagEf).replace('$', '$') : '—'}</td><td class="num bad">${m.pagBco ? '−' + money(m.pagBco) : '—'}</td>
      <td class="num ${m.finEf < 0 ? 'bad' : ''}">${money(m.finEf)}</td><td class="num ${m.finBco < 0 ? 'bad' : ''}">${money(m.finBco)}</td><td class="num"><b class="${m.fin < 0 ? 'bad' : ''}">${money(m.fin)}</b></td></tr>`),
    { foot: ms.length ? `<tr><td>Período</td><td class="num">${money(ms[0].ini)}</td><td class="num">${money(sum(ms, m => m.cobEf))}</td><td class="num">${money(sum(ms, m => m.cobBco))}</td><td class="num">${money(sum(ms, m => m.pagEf))}</td><td class="num">${money(sum(ms, m => m.pagBco))}</td><td class="num">${money(ms[ms.length - 1].finEf)}</td><td class="num">${money(ms[ms.length - 1].finBco)}</td><td class="num">${money(ms[ms.length - 1].fin)}</td></tr>` : '' })}</div>
  <p class="small muted">Los depósitos del efectivo en el banco son traspasos internos: cambian la columna (efectivo → banco) pero no el saldo total.</p>`;
}
Acc.verMesCaja = el => {
  const k = el.dataset.m;
  const rs = ledger().filter(r => (r.estado === 'Cobrado' || r.estado === 'Pagado') && mesKey(r.fechaEf) === k && r.fechaEf <= HOY_ISO).sort((a, b) => a.fechaEf.localeCompare(b.fechaEf));
  const tr = Store.list('movimientos', m => m.tipo === 'traspaso' && mesKey(m.fecha) === k);
  modal({ titulo: `Caja de ${mesLargo(k)}`, ancho: 'wide', cuerpo: tabla([{ h: 'Fecha' }, { h: 'Concepto' }, { h: 'Evento' }, { h: 'Medio' }, { h: 'Entra', num: 1 }, { h: 'Sale', num: 1 }],
    [...rs.map(r => `<tr><td>${fdc(r.fechaEf)}</td><td>${esc(r.concepto)}</td><td class="small">${esc(nomEv(r.eventoId))}</td><td>${r.medio}</td><td class="num ok">${r.tipo === 'ingreso' ? money(r.monto) : ''}</td><td class="num bad">${r.tipo === 'egreso' ? money(r.monto) : ''}</td></tr>`),
     ...tr.map(t => `<tr><td>${fdc(t.fecha)}</td><td><i>${esc(t.concepto)}</i></td><td class="small muted">Traspaso interno</td><td>Efectivo → Banco</td><td class="num muted" colspan="2">${money(t.monto)}</td></tr>`)],
    { foot: `<tr><td colspan="4">Total del mes</td><td class="num">${money(sum(rs.filter(r => r.tipo === 'ingreso'), r => r.monto))}</td><td class="num">${money(sum(rs.filter(r => r.tipo === 'egreso'), r => r.monto))}</td></tr>`, vacioTxt: 'Sin movimientos reales este mes.' }) });
};

function docRendicion(ev) {
  const f = finEvento(ev), G = f.G, C = CATEGORIAS[ev.cat];
  const ing = [];
  if (ev.cat === 'cena') ing.push([f.auto.label, `${num(f.auto.unidades)} tarjetas · promedio ${money(f.auto.precioProm)}`, f.auto.cobrado >= f.auto.vendido ? 'Cobrado' : `Cobrado ${money(f.auto.cobrado)}`, f.auto.vendido]);
  if (ev.cat === 'rifa') ing.push([f.auto.label, `${num(f.auto.unidades)} números × ${money(ev.cfg.precio)}`, f.auto.cobrado >= f.auto.vendido ? 'Cobrado' : `Cobrado ${money(f.auto.cobrado)}`, f.auto.vendido]);
  if (ev.cat === 'remate') ing.push([f.auto.label, `${f.auto.unidades} lotes de ${f.auto.unidadesTot}`, f.auto.cobrado >= f.auto.vendido ? 'Cobrado' : `Cobrado ${money(f.auto.cobrado)}`, f.auto.vendido]);
  f.otros.rows.forEach(m => ing.push([m.concepto, m.categoria, m.estado, m.monto]));
  const cats = groupBy([...G.items.map(g => ({ cat: g.cat, total: g.total, pag: pagadoGasto(g) })), ...G.compras.map(c => ({ cat: 'Compras', total: c.cant * c.pu, pag: c.comprado ? c.cant * c.pu : 0 })), ...G.movs.map(m => ({ cat: m.categoria, total: m.monto, pag: m.estado === 'Pagado' ? m.monto : 0 }))], x => x.cat);

  const B = [
    { t: 'p', txt: `${{ cena: ev.fecha < HOY_ISO ? 'Cena bailable realizada el' : 'Cena bailable prevista para el', rifa: ev.cfg.sorteada ? 'Rifa sorteada el' : 'Rifa con sorteo previsto el', remate: ev.fecha < HOY_ISO ? 'Remate realizado el' : 'Remate previsto para el' }[ev.cat]} <b>${fdl(ev.fecha)}</b> en ${esc(ev.lugar)}. Coordinación: ${esc(nomSoc(ev.coordinadorId))}. Fondos destinados a: <b>${esc(ev.causa)}</b>.${ev.fecha >= HOY_ISO ? ' <i>Informe preliminar: el evento todavía no se realizó.</i>' : ''}` },
    { t: 'kpis', items: [['Ingresos', money(f.ingresos)], ['Gastos', money(f.gTotal)], ['Resultado neto', money(f.resultado), true], ['De la meta', f.pctMeta + '%']] },
    { t: 'h2', txt: '¿Qué se recaudó?' },
    { t: 'tabla', cols: [['Concepto'], ['Detalle'], ['Estado'], ['Monto', 'money']], filas: ing, pie: ['Total de ingresos', '', '', f.ingresos] },
    { t: 'h2', txt: '¿En qué se gastó?' },
    { t: 'tabla', cols: [['Categoría'], ['Ítems', 'num'], ['Total', 'money'], ['Pagado', 'money'], ['Pendiente', 'money']], filas: Object.entries(cats).map(([k, xs]) => [k, xs.length, sum(xs, x => x.total), sum(xs, x => x.pag), sum(xs, x => x.total - x.pag)]).sort((a, b) => b[2] - a[2]), pie: ['Total de gastos', '', f.gTotal, f.gPagado, f.gPend] },
    { t: 'tabla', titulo: 'Detalle de gastos', cols: [['Ítem'], ['Categoría'], ['Proveedor'], ['Estado'], ['Monto', 'money']], filas: [...G.items.map(g => [g.item, g.cat, g.proveedorId ? nomCol(g.proveedorId) : '—', g.estado, g.total]), ...G.compras.map(c => [`${c.item} (${c.cant} × ${money(c.pu)})`, 'Compras', c.donde, c.comprado ? 'Pagado' : 'Pendiente', c.cant * c.pu])] }
  ];
  if (ev.cat === 'cena') { const s = statsCena(ev); B.push({ t: 'h2', txt: 'La noche en números' }, { t: 'kpis', items: [[ev.fecha < HOY_ISO ? 'Asistentes' : 'Invitados', num(ev.fecha < HOY_ISO ? s.llegaron || s.total : s.total)], ['Mesas', s.mesas.length], ['Costo por cubierto', money(s.total ? f.gTotal / s.total : 0)], ['Resultado por invitado', money(s.total ? f.resultado / s.total : 0)]] }); }
  if (ev.cat === 'rifa') { const ps = Store.list('premios', p => p.eventoId === ev.id).sort((a, b) => a.orden - b.orden); B.push({ t: 'h2', txt: 'Premios y ganadores' }, { t: 'tabla', cols: [['Premio'], ['Descripción'], ['Donado por'], ['Número'], ['Ganador']], filas: ps.map(p => [ordinal(p.orden), p.desc, nomCol(p.donanteId), p.ganadorN != null ? fmtN(ev, p.ganadorN) : '—', p.ganador || 'Sin sortear']) }); }
  if (ev.cat === 'remate') { const s = statsRemate(ev); B.push({ t: 'h2', txt: 'Lotes destacados' }, { t: 'kpis', items: [['Lotes rematados', `${s.adj.length} de ${s.total}`], ['Valor estimado', money(s.valorEstimado)], ['Rematado', money(s.rematado)], ['Por cobrar', money(s.porCobrar)]] },
    { t: 'tabla', cols: [['Lote'], ['Título'], ['Donante'], ['Precio final', 'money']], filas: s.adj.slice().sort((a, b) => b.final - a.final).slice(0, 8).map(l => [l.n, l.titulo, nomCol(l.donanteId), l.final]) }); }
  B.push({ t: 'h2', txt: 'Resultado y destino de los fondos' },
    { t: 'p', txt: `El resultado neto de <b>${money(f.resultado)}</b> se destina a <b>${esc(ev.causa)}</b>.${f.porCobrar > 0 ? ` Quedan ${money(f.porCobrar)} por cobrar y ${money(f.gPend)} por pagar.` : ''}${entregas.length ? ` A la fecha se entregaron <b>${money(entregado)}</b>${f.resultado - entregado > 0 ? ` y resta entregar ${money(f.resultado - entregado)}` : ''}.` : ' Los fondos se entregarán una vez cerrados todos los cobros y pagos.'}` });

}

/* Marca de agua de WYDAN: aparece en la vista previa, en cada hoja impresa y en cada página de los PDF */
function imprimirHTML(html, apaisado = false) {

  let st = $('#print-page'); if (!st) { st = document.createElement('style'); st.id = 'print-page'; document.head.appendChild(st); }
  st.textContent = `@page{size:A4 ${apaisado ? 'landscape' : 'portrait'};margin:12mm}`;
  document.body.classList.add('printing');
  const fin = () => { document.body.classList.remove('printing'); pr.innerHTML = ''; window.removeEventListener('afterprint', fin); };

function svgAPng(svg, w, h, escala = 2) {
  return new Promise((ok, mal) => {
    const s = svg.replace(/^<svg /, `<svg width="${w}" height="${h}" `);
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = w * escala; c.height = h * escala; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); try { ok(c.toDataURL('image/png')); } catch (e) { mal(e); } };
    img.onerror = mal; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  });
}

/* ---------- Excel (.xlsx real, con formato) ---------- */
async function exportarXLSX(spec) {
  if (!spec) return;
  toast('Generando Excel…');
  let conEstilo = true;
  try { await cargarScript(CDN.xlsx); } catch (e) { conEstilo = false; try { await cargarScript(CDN.xlsxAlt); } catch (e2) { toast('Para exportar a Excel se necesita conexión a internet', 'bad'); return; } }
  const sp = Array.isArray(spec) ? (spec.resumen || spec[0]) : spec;
  const club = Store.club(), rows = [], est = {}, merges = [];
  const AZ = '17458F', FMT = '"$" #,##0;[Red]-"$" #,##0';
  let maxCols = 2;
  sp.bloques.forEach(b => { if (b.t === 'tabla') maxCols = Math.max(maxCols, b.cols.length); if (b.t === 'kpis') maxCols = Math.max(maxCols, 2); });
  const push = (arr, estilo) => { rows.push(arr); if (estilo) est[rows.length - 1] = estilo; };
  push([club.nombre], 'club'); push([sp.titulo + (sp.subtitulo ? ' · ' + sp.subtitulo : '')], 'titulo'); push([`Generado el ${fd(HOY_ISO)}${UI.user ? ' por ' + UI.user.nombre : ''}`], 'sub'); push([]);
  const tipos = {};
  sp.bloques.forEach(b => {
    if (b.t === 'h2') { push([pdfTxt(b.txt)], 'h2'); }
    else if (b.t === 'p') { push([pdfTxt(b.txt)], 'p'); merges.push({ s: { r: rows.length - 1, c: 0 }, e: { r: rows.length - 1, c: maxCols - 1 } }); }
    else if (b.t === 'kpis') { b.items.forEach(([l, v]) => push([pdfTxt(l), pdfTxt(v)], 'kpi')); push([]); }
    else if (b.t === 'tabla') {
      if (b.titulo) push([pdfTxt(b.titulo)], 'h2');
      push(b.cols.map(c => c[0]), 'head');
      b.filas.forEach(f => { push(f.map((v, i) => { const t = b.cols[i][1]; if (t === 'money' || t === 'num') return Number(v) || 0; if (t === 'date') return v ? fd(v) : ''; return pdfTxt(v); })); tipos[rows.length - 1] = b.cols.map(c => c[1]); });
      if (b.pie) { push(b.pie.map((v, i) => { const t = b.cols[i][1]; return (t === 'money' || t === 'num') && v !== '' ? Number(v) || 0 : pdfTxt(v); }), 'foot'); tipos[rows.length - 1] = b.cols.map(c => c[1]); }
      push([]);
    }
    else if (b.t === 'firmas') { push([]); push(b.items.map(([n, c]) => `${n} (${c})`), 'p'); }
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const borde = { top: { style: 'thin', color: { rgb: 'DDE3EC' } }, bottom: { style: 'thin', color: { rgb: 'DDE3EC' } }, left: { style: 'thin', color: { rgb: 'DDE3EC' } }, right: { style: 'thin', color: { rgb: 'DDE3EC' } } };
  rows.forEach((r, ri) => r.forEach((v, ci) => {
    const a = XLSX.utils.encode_cell({ r: ri, c: ci }), cell = ws[a]; if (!cell) return;
    const t = tipos[ri] && tipos[ri][ci];
    if (t === 'money' && typeof cell.v === 'number') { cell.t = 'n'; cell.z = FMT; }
    if (!conEstilo) return;
    const e = est[ri];
    const s = { font: { name: 'Calibri', sz: 11, color: { rgb: '1F2A44' } }, alignment: { vertical: 'center', wrapText: e === 'p' } };
    if (e === 'club') s.font = { name: 'Calibri', sz: 10, bold: true, color: { rgb: 'C98507' } };
    if (e === 'titulo') s.font = { name: 'Georgia', sz: 16, color: { rgb: AZ } };
    if (e === 'sub') s.font = { name: 'Calibri', sz: 9, italic: true, color: { rgb: '5E6A84' } };
    if (e === 'h2') s.font = { name: 'Georgia', sz: 13, color: { rgb: AZ } };
    if (e === 'kpi') { s.font = { name: 'Calibri', sz: 11, bold: ci === 1, color: { rgb: ci === 1 ? AZ : '5E6A84' } }; }
    if (e === 'head') { s.font = { name: 'Calibri', sz: 11, bold: true, color: { rgb: 'FFFFFF' } }; s.fill = { patternType: 'solid', fgColor: { rgb: AZ } }; s.border = borde; s.alignment = { horizontal: 'center', vertical: 'center', wrapText: true }; }
    if (tipos[ri] && e !== 'foot') { s.border = borde; if (ri % 2) s.fill = { patternType: 'solid', fgColor: { rgb: 'F7F9FC' } }; }
    if (e === 'foot') { s.font = { name: 'Calibri', sz: 11, bold: true, color: { rgb: AZ } }; s.fill = { patternType: 'solid', fgColor: { rgb: 'EAF0FA' } }; s.border = { ...borde, top: { style: 'medium', color: { rgb: AZ } } }; }
    if (t === 'money' || t === 'num') s.alignment = { horizontal: 'right' };
    cell.s = s;
  }));
  ws['!cols'] = [...Array(maxCols)].map((_, c) => ({ wch: Math.min(60, Math.max(10, ...rows.filter((r, i) => !['p', 'titulo', 'club', 'sub', 'h2'].includes(est[i])).map(r => String(r[c] ?? '').length + 2))) }));
  ws['!merges'] = merges;
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, pdfTxt(sp.titulo).replace(/[\[\]:*?/\\]/g, '').slice(0, 31) || 'Reporte');
  XLSX.writeFile(wb, `${pdfTxt(sp.archivo || sp.titulo).replace(/[\\/:*?"<>|]/g, '')}.xlsx`);
  toast('Excel descargado');
}
